<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权限中心</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-white min-h-screen">
    <div id="app">
        <!-- 顶部导航栏 -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
            <div class="px-8 h-14 flex items-center justify-between">
                <!-- Left: Logo + Tabs -->
                <div class="flex items-center h-full">
                    <div class="flex items-center gap-2 mr-6 flex-shrink-0">
                        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center">
                            <i class="ph ph-shield-check text-white text-base"></i>
                        </div>
                        <h1 class="text-base font-semibold text-slate-800">权限中心</h1>
                    </div>
                    <div class="w-px h-5 bg-slate-200 mr-6 flex-shrink-0"></div>
                    <!-- Tabs inline in navbar -->
                    <nav class="flex items-center h-full">
                        <button @click="permissionCenterTab = 'my_applications'; showApplyFlow = false"
                            :class="['flex items-center gap-1.5 px-4 h-full text-sm font-medium border-b-2 transition-colors relative', permissionCenterTab === 'my_applications' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-600 hover:text-slate-900']">
                            我的申请
                        </button>
                        <button @click="permissionCenterTab = 'my_permissions'; showApplyFlow = false"
                            :class="['px-4 h-full text-sm font-medium border-b-2 transition-colors', permissionCenterTab === 'my_permissions' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-600 hover:text-slate-900']">
                            我的权限
                        </button>
                        <button @click="permissionCenterTab = 'my_approval'; showApplyFlow = false"
                            :class="['px-4 h-full text-sm font-medium border-b-2 transition-colors', permissionCenterTab === 'my_approval' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-600 hover:text-slate-900']">
                            我的审批
                        </button>
                        <!-- 权限审计清查和管理员设置已隐藏 -->
                    </nav>
                </div>
                <!-- Right: Link + Avatar -->
                <div class="flex items-center gap-3 flex-shrink-0">
                    <a href="index.html" class="flex items-center gap-1.5 text-slate-500 hover:text-indigo-600 transition-colors text-sm">
                        <i class="ph ph-squares-four text-sm"></i>
                        <span>资源管理中心</span>
                    </a>
                    <div class="relative">
                        <button class="w-9 h-9 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold text-sm shadow-sm hover:bg-indigo-600 transition-colors">
                            YZ
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 主内容区：全宽，无卡片包裹 -->
        <main class="px-8 py-6 bg-slate-50 min-h-[calc(100vh-56px)]">
            <permission-center></permission-center>
        </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./js/hr_mock_data.js"></script>
    <script src="./js/templates.js"></script>
    <script src="./js/permission_bundle.js"></script>
</body>
</html>
