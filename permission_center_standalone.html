<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权限中心</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-white min-h-screen">
    <div id="app">
        <!-- 顶部导航栏 -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
            <div class="px-8 h-14 flex items-center justify-between">
                <!-- Left: Logo + Tabs -->
                <div class="flex items-center h-full">
                    <div class="flex items-center gap-2 mr-6 flex-shrink-0">
                        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center">
                            <i class="ph ph-shield-check text-white text-base"></i>
                        </div>
                        <h1 class="text-base font-semibold text-slate-800">权限中心</h1>
                    </div>
                    <div class="w-px h-5 bg-slate-200 mr-6 flex-shrink-0"></div>
                    <!-- Tabs inline in navbar -->
                    <nav class="flex items-center h-full">
                        <button @click="permissionCenterTab = 'my_applications'; showApplyFlow = false"
                            :class="['flex items-center gap-1.5 px-4 h-full text-sm font-medium border-b-2 transition-colors relative', permissionCenterTab === 'my_applications' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-600 hover:text-slate-900']">
                            我的申请
                        </button>
                        <button @click="permissionCenterTab = 'my_permissions'; showApplyFlow = false"
                            :class="['px-4 h-full text-sm font-medium border-b-2 transition-colors', permissionCenterTab === 'my_permissions' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-600 hover:text-slate-900']">
                            我的权限
                        </button>
                        <button @click="permissionCenterTab = 'my_approval'; showApplyFlow = false"
                            :class="['px-4 h-full text-sm font-medium border-b-2 transition-colors', permissionCenterTab === 'my_approval' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-600 hover:text-slate-900']">
                            我的审批
                        </button>
                        <!-- 权限审计清查和管理员设置已隐藏 -->
                    </nav>
                </div>
                <!-- Right: Link + Avatar -->
                <div class="flex items-center gap-3 flex-shrink-0">
                    <a href="index.html" class="flex items-center gap-1.5 text-slate-500 hover:text-indigo-600 transition-colors text-sm">
                        <i class="ph ph-squares-four text-sm"></i>
                        <span>资源管理中心</span>
                    </a>
                    <div class="relative">
                        <button class="w-9 h-9 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold text-sm shadow-sm hover:bg-indigo-600 transition-colors">
                            YZ
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 主内容区：全宽，无卡片包裹 -->
        <main class="px-8 py-6 bg-slate-50 min-h-[calc(100vh-56px)]">
            <permission-center></permission-center>
        </main>
    </div>

                            <input v-model="editingRule.name" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="例如：部门数据隔离" />

                        <!-- 授权对象 -->

                                            <i class="ph ph-user text-slate-500"></i>
                                            <div class="flex-1"><div class="text-sm font-medium">张三</div><div class="text-xs text-slate-500">工号: E12345</div></div>
                                        </div>
                                        <div @click="$emit('selectAudience', 'role', 'HRBP')"

                                            <div class="flex-1"><div class="text-sm font-medium">HRBP</div><div class="text-xs text-slate-500">人群组 · 35人</div></div>
                                        </div>
                                        <div @click="$emit('selectAudience', 'role', '管理者')"
                                            class="px-3 py-2 hover:bg-slate-50 rounded cursor-pointer flex items-center gap-2">
                                            <i class="ph ph-users text-indigo-500"></i>
                                            <div class="flex-1"><div class="text-sm font-medium">管理者</div><div class="text-xs text-slate-500">人群组 · 82人</div></div>
                                        </div>
                                        <div @click="$emit('selectAudience', 'department', '研发部')"

                        <!-- ═══════════════════════════════════════════ -->
                        <!-- 列权限 (Column Permissions) -->
                        <!-- ═══════════════════════════════════════════ -->
                        <div v-if="!isGlobal" class="space-y-4">
                            <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                                <div class="flex items-center gap-2">
                                    <div class="w-7 h-7 rounded-lg bg-blue-50 flex items-center justify-center">
                                        <i class="ph ph-columns text-blue-600 text-sm"></i>
                                    </div>
                                    <h4 class="text-sm font-bold text-slate-800">列权限</h4>
                                    <span class="text-[10px] text-slate-400 bg-slate-50 px-2 py-0.5 rounded-full">字段可见范围</span>
                                </div>
                                <!-- 列权限规则来源选择 -->
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[10px] text-slate-400">规则来源</span>
                                    <div class="flex gap-1.5">
                                        <button @click="switchColumnRuleSource('custom')" 
                                            :class="['px-2.5 py-1 border-2 rounded text-xs font-medium transition-all flex items-center justify-center gap-1', editingRule.columnRuleSource === 'custom' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-200 hover:border-indigo-300 text-slate-500']">
                                            <i class="ph ph-file-text text-xs"></i>
                                            <span>定义表专属规则</span>
                                        </button>
                                        <button @click="switchColumnRuleSource('global_reference')" 
                                            :class="['px-2.5 py-1 border-2 rounded text-xs font-medium transition-all flex items-center justify-center gap-1', editingRule.columnRuleSource === 'global_reference' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-200 hover:border-indigo-300 text-slate-500']">
                                            <i class="ph ph-link text-xs"></i>
                                            <span>引用访问控制规则</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- ────────────────────────────────────── -->
                            <!-- 列权限：定义表专属规则 → 字段范围 -->
                            <!-- ────────────────────────────────────── -->
                            <div v-if="editingRule.columnRuleSource === 'custom' || !editingRule.columnRuleSource">
                                <label class="block text-xs font-medium text-slate-500 mb-2 uppercase tracking-wider">字段范围</label>
                                <div class="space-y-3">
                                    <div class="grid grid-cols-3 gap-3">
                                        <button @click="editingRule.columnVisibility.mode = 'all'"
                                            :class="['px-4 py-2.5 border-2 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2', editingRule.columnVisibility.mode === 'all' ? 'border-green-500 bg-green-50 text-green-700' : 'border-slate-200 hover:border-green-300 text-slate-700']">
                                            <i class="ph ph-check-circle"></i> 全部字段
                                        </button>
                                        <button @click="editingRule.columnVisibility.mode = 'include'" 
                                            :class="['px-4 py-2.5 border-2 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2', editingRule.columnVisibility.mode === 'include' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-slate-200 hover:border-blue-300 text-slate-700']">
                                            <i class="ph ph-eye"></i> 授权字段
                                        </button>
                                        <button @click="editingRule.columnVisibility.mode = 'exclude'" 
                                            :class="['px-4 py-2.5 border-2 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2', editingRule.columnVisibility.mode === 'exclude' ? 'border-red-500 bg-red-50 text-red-700' : 'border-slate-200 hover:border-red-300 text-slate-700']">
                                            <i class="ph ph-eye-slash"></i> 排除字段
                                        </button>
                                    </div>
                                    <!-- 字段搜索框（仅授权/排除模式） -->
                                    <div v-if="editingRule.columnVisibility.mode !== 'all'" class="relative mb-2">
                                        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                        <input v-model="columnSearchQuery" type="text"
                                            placeholder="搜索字段名或描述..."
                                            class="w-full pl-8 pr-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                                        <button v-if="columnSearchQuery" @click="columnSearchQuery = ''" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            <i class="ph ph-x text-xs"></i>
                                        </button>
                                    </div>
                                    <!-- 字段列表 -->
                                    <div class="border border-slate-200 rounded-lg overflow-hidden bg-white">
                                        <div class="max-h-48 overflow-y-auto">
                                            <table class="min-w-full divide-y divide-slate-200">
                                                <thead class="bg-slate-50 sticky top-0 z-10 transition-colors">
                                                    <tr class="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">
                                                        <th class="w-12 px-4 py-2 text-center">
                                                            {{ editingRule.columnVisibility.mode === 'all' ? '' : '选择' }}
                                                        </th>
                                                        <th class="px-4 py-2 text-left">字段名</th>
                                                        <th class="px-4 py-2 text-left">描述</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-slate-200">
                                                    <tr v-for="field in schemaFields" :key="field.name"
                                                        v-show="editingRule.columnVisibility.mode === 'all' || !columnSearchQuery.trim() || field.name.toLowerCase().includes(columnSearchQuery.trim().toLowerCase()) || (field.description && field.description.toLowerCase().includes(columnSearchQuery.trim().toLowerCase()))"
                                                        class="hover:bg-slate-50 transition-colors"
                                                        :class="{'bg-indigo-50/40': (editingRule.columnVisibility.mode === 'all') || (editingRule.columnVisibility.fields.includes(field.name))}">
                                                        <td class="px-4 py-2.5 text-center">
                                                            <template v-if="editingRule.columnVisibility.mode === 'all'">
                                                                <i class="ph-fill ph-check-circle text-green-500 text-base"></i>
                                                            </template>
                                                            <input v-else type="checkbox" 
                                                                :checked="editingRule.columnVisibility.fields.includes(field.name)"
                                                                @change="$emit('toggleColumnField', field.name)"
                                                                class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                                                        </td>
                                                        <td class="px-4 py-2.5 w-40">
                                                            <span class="text-xs font-mono font-medium text-slate-900">{{ field.name }}</span>
                                                        </td>
                                                        <td class="px-4 py-2.5">
                                                            <span class="text-xs text-slate-500 truncate block max-w-xs">{{ field.description }}</span>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div v-if="editingRule.columnVisibility.mode !== 'all'" class="px-4 py-2 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
                                            <p class="text-[11px] text-slate-500">
                                                已选择 <span class="text-indigo-600 font-bold">{{ editingRule.columnVisibility.fields.length }}</span> 个字段
                                            </p>
                                            <button v-if="editingRule.columnVisibility.fields.length > 0" @click="editingRule.columnVisibility.fields = []" class="text-xs text-slate-400 hover:text-red-500 transition-colors">
                                                <i class="ph ph-x-circle text-xs mr-0.5"></i>清空选择
                                            </button>
                                        </div>
                                        <div v-if="editingRule.columnVisibility.mode === 'all'" class="px-4 py-2 bg-slate-50 border-t border-slate-200">
                                            <p class="text-[11px] text-slate-500">
                                                已选择全部字段
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ═══════════════════════════════════════════ -->
                        <!-- 列权限：引用访问控制规则（仅选择规则） -->
                        <!-- ═══════════════════════════════════════════ -->
                        <template v-if="!isGlobal && editingRule.columnRuleSource === 'global_reference'">
                            <!-- 列权限规则选择（支持多选） -->
                            <div class="space-y-4">
                                <!-- 列权限规则多选 -->
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-2 uppercase tracking-wider">选择列权限规则</label>
                                    <div class="relative mb-3">
                                        <input v-model="editingRule.refRuleSearchQuery" type="text"
                                            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                            placeholder="搜索列权限规则..." />
                                        <i class="ph ph-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                    </div>
                                    <div class="space-y-1">
                                        <div v-for="rule in filteredRefRules" :key="rule.id"
                                            @click="toggleRefRule(rule)"
                                            :class="['px-3 py-2 border rounded-lg transition-all group cursor-pointer flex items-center justify-between',
                                                editingRule.selectedRefRules && editingRule.selectedRefRules.some(r => r.id === rule.id) ? 'border-indigo-300 bg-indigo-50/50' : 'border-slate-200 hover:border-indigo-300']">
                                            <div class="flex items-center gap-2 min-w-0">
                                                <i :class="['ph ph-check-circle text-sm flex-shrink-0', editingRule.selectedRefRules && editingRule.selectedRefRules.some(r => r.id === rule.id) ? 'text-indigo-600' : 'text-slate-300']"></i>
                                                <i class="ph ph-shield-check text-indigo-500 text-xs flex-shrink-0"></i>
                                                <span class="text-sm font-medium text-slate-800 group-hover:text-indigo-600 truncate">{{ rule.name }}</span>
                                                <span class="text-[11px] text-slate-400 flex-shrink-0">{{ rule.description ? rule.description.substring(0, 30) + '...' : '' }}</span>
                                            </div>
                                            <span v-if="editingRule.selectedRefRules && editingRule.selectedRefRules.some(r => r.id === rule.id)" class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] bg-green-50 text-green-700 flex-shrink-0">
                                                <i class="ph ph-check text-[10px] mr-0.5"></i>已选
                                            </span>
                                        </div>
                                        <div v-if="filteredRefRules.length === 0" class="p-6 text-center text-slate-400">
                                            <i class="ph ph-shield-check text-2xl block mb-2"></i>
                                            <p class="text-sm">暂无匹配的列权限规则</p>
                                        </div>
                                    </div>
                                </div>

                                <!-- OR 关系提示 -->
                                <div v-if="editingRule.selectedRefRules && editingRule.selectedRefRules.length > 1" class="px-3 py-2 bg-amber-50 border border-amber-200 rounded-lg flex items-center gap-2">
                                    <i class="ph ph-info text-amber-600 text-sm"></i>
                                    <span class="text-xs text-amber-800">多条规则之间为<span class="font-bold">「或」(OR)</span>关系，满足任意一条即可获得列权限</span>
                                </div>

                                <!-- 已选规则的表与字段展示 -->
                                <div v-if="editingRule.selectedRefRules && editingRule.selectedRefRules.length > 0" class="space-y-2">
                                    <div v-for="(selectedRefRule, ruleIdx) in editingRule.selectedRefRules" :key="selectedRefRule.id"
                                        class="border border-slate-200 rounded-lg overflow-hidden">
                                        <!-- 规则头部（可点击展开/收起） -->
                                        <div @click="toggleRefRuleExpand(ruleIdx)" class="px-3 py-2.5 bg-indigo-50/50 border-b border-slate-200 flex items-center justify-between cursor-pointer hover:bg-indigo-50 transition-colors">
                                            <div class="flex items-center gap-2">
                                                <i :class="['ph ph-caret-right text-sm text-slate-400 transition-transform duration-200', expandedRefRuleIndex === ruleIdx ? 'rotate-90' : '']"></i>
                                                <span class="w-5 h-5 rounded-full bg-indigo-600 text-white text-[11px] font-bold flex items-center justify-center">{{ ruleIdx + 1 }}</span>
                                                <i class="ph ph-shield-check text-indigo-600 text-xs"></i>
                                                <span class="text-sm font-medium text-indigo-800">{{ selectedRefRule.name }}</span>
                                                <span v-if="selectedRefRule.tableFields" class="text-[11px] text-slate-400">{{ Object.keys(selectedRefRule.tableFields).filter(k => selectedRefRule.tableFields[k].length > 0).length }}个表 {{ Object.values(selectedRefRule.tableFields).reduce((a, b) => a + b.length, 0) }}个字段</span>
                                            </div>
                                            <button @click.stop="removeRefRule(selectedRefRule)" class="text-xs text-red-500 hover:text-red-700 flex items-center gap-1">
                                                <i class="ph ph-x-circle"></i> 移除
                                            </button>
                                        </div>
                                        <!-- 展开内容：按权限点分组的表和字段 -->
                                        <div v-if="expandedRefRuleIndex === ruleIdx" class="p-3 space-y-3">
                                            <div class="flex items-center gap-2 text-xs text-slate-500 mb-1">
                                                <i class="ph ph-info text-blue-500"></i>
                                                <span>按权限点分组，展示该规则关联的表和表字段</span>
                                            </div>
                                            <div v-for="group in getRefRuleGroupedByPermissionPoint(selectedRefRule)" :key="group.permissionPoint" class="border border-slate-100 rounded-lg overflow-hidden">
                                                <!-- 权限点分组标题 -->
                                                <div class="px-3 py-2 bg-indigo-50/30 flex items-center gap-2 border-b border-slate-100">
                                                    <i class="ph ph-key text-indigo-500 text-sm"></i>
                                                    <span class="text-sm font-semibold text-indigo-700">{{ group.permissionPoint }}</span>
                                                    <span class="text-xs text-slate-500">{{ group.tables.length }}个表 {{ group.tables.reduce((a, t) => a + t.fields.length, 0) }}个字段</span>
                                                </div>
                                                <!-- 表和字段 -->
                                                <div v-for="table in group.tables" :key="table.name" class="px-3 py-2 border-b border-slate-100 last:border-b-0">
                                                    <div class="flex items-center gap-2 mb-1.5">
                                                        <i class="ph ph-table text-slate-500 text-sm"></i>
                                                        <span class="text-xs font-mono font-semibold text-slate-700">{{ table.name }}</span>
                                                        <span v-if="table.chineseName" class="text-xs text-slate-500">{{ table.chineseName }}</span>
                                                        <span class="text-[11px] text-slate-400">{{ table.fields.length }}个字段</span>
                                                    </div>
                                                    <div class="flex flex-wrap gap-1">
                                                        <span v-for="field in table.fields" :key="field" class="inline-flex items-center px-1.5 py-0.5 rounded text-xs bg-blue-50 text-blue-700 border border-blue-100 font-mono">
                                                            {{ field }}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                            <!-- 无权限点分组 -->
                                            <div v-if="getRefRuleGroupedByPermissionPoint(selectedRefRule).length === 0" class="text-center py-3 text-sm text-slate-400">
                                                <i class="ph ph-shield-warning text-xl block mb-1"></i>
                                                暂无关联的表字段信息
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>


                        <!-- ═══════════════════════════════════════════ -->
                        <!-- 非全局规则：行权限配置 -->
                        <!-- ═══════════════════════════════════════════ -->
                        <div v-if="!isGlobal" class="space-y-4">
                            <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                                <div class="flex items-center gap-2">
                                    <div class="w-7 h-7 rounded-lg bg-amber-50 flex items-center justify-center">
                                        <i class="ph ph-rows text-amber-600 text-sm"></i>
                                    </div>
                                    <h4 class="text-sm font-bold text-slate-800">行权限</h4>

                                </div>
                                <!-- 行权限规则来源选择 -->
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[10px] text-slate-400">规则来源</span>
                                    <div class="flex gap-1.5">
                                        <button @click="switchRowRuleSource('custom')" 
                                            :class="['px-2.5 py-1 border-2 rounded text-xs font-medium transition-all flex items-center justify-center gap-1', editingRule.rowRuleSource === 'custom' ? 'border-amber-500 bg-amber-50 text-amber-700' : 'border-slate-200 hover:border-amber-300 text-slate-500']">
                                            <i class="ph ph-file-text text-xs"></i>
                                            <span>定义表专属规则</span>
                                        </button>
                                        <button @click="switchRowRuleSource('global_reference')" 
                                            :class="['px-2.5 py-1 border-2 rounded text-xs font-medium transition-all flex items-center justify-center gap-1', editingRule.rowRuleSource === 'global_reference' ? 'border-amber-500 bg-amber-50 text-amber-700' : 'border-slate-200 hover:border-amber-300 text-slate-500']">
                                            <i class="ph ph-link text-xs"></i>
                                            <span>引用访问控制规则</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- ────────────────────────────────────── -->
                            <!-- 行权限：定义表专属规则 → 行范围类型选择 -->
                            <!-- ────────────────────────────────────── -->
                            <div v-if="editingRule.rowRuleSource === 'custom' || !editingRule.rowRuleSource">
                                <!-- 行范围类型 radio buttons -->
                                <div class="flex items-center gap-4 mb-3">
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" v-model="editingRule.rowRangeType" value="specified"
                                            class="w-4 h-4 text-amber-600 border-slate-300 focus:ring-amber-500" />
                                        <span class="text-sm font-medium text-slate-700">指定行范围</span>
                                        <span class="text-xs text-slate-400">按条件筛选可见行</span>
                                    </label>
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" v-model="editingRule.rowRangeType" value="all"
                                            class="w-4 h-4 text-amber-600 border-slate-300 focus:ring-amber-500" />
                                        <span class="text-sm font-medium text-slate-700">全部行</span>
                                        <span class="text-xs text-slate-400">不限制行可见范围</span>
                                    </label>
                                </div>

                                <!-- 指定行范围：显示行过滤条件 -->
                                <template v-if="editingRule.rowRangeType !== 'all'">
                                <div class="flex items-center justify-between mb-2">
                                    <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">行过滤条件</label>
                                    <button @click="$emit('addRowFilter')" class="px-2 py-1 text-xs text-amber-600 hover:bg-amber-50 rounded flex items-center gap-1">
                                        <i class="ph ph-plus"></i> 添加条件
                                    </button>
                                </div>
                                <div class="space-y-2">
                                    <div v-for="(filter, index) in editingRule.rowFilters" :key="index" class="flex items-start gap-2">
                                        <div class="w-6 h-9 flex items-center justify-center text-xs font-medium text-slate-500 flex-shrink-0">
                                            {{ index + 1 }}
                                        </div>
                                        <div class="flex-1 grid grid-cols-12 gap-2 p-2.5 bg-amber-50/30 rounded-lg border border-amber-200/50">
                                            <select v-model="filter.field" class="col-span-3 px-2 py-1.5 border border-slate-300 rounded text-sm bg-white focus:ring-2 focus:ring-amber-500 focus:border-transparent">
                                                <option value="">选择标签</option>

                                                                    </div>
                                                                </div>

// 异步加载 PermissionCenter / CategoryManagement 模板
(function() {
    function loadTemplate(key, path) {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', path + '?v=' + Date.now(), false);
        xhr.send();
        if (xhr.status === 200) {
            window.AppTemplates[key] = xhr.responseText;
        }
    }
    loadTemplate('PermissionCenter', './js/templates/PermissionCenter.html');
    loadTemplate('CategoryManagement', './js/templates/CategoryManagement.html');
    loadTemplate('FieldEditModal', './js/templates/FieldEditModal.html');
})();

s.find(r=>r.id===permissionApplyForm.roleId).tableRowRules[tableId].rowRuleDesc }}\n                                                                <i class="ph ph-caret-down text-[10px] opacity-60"></i>\n                                                            </button>\n                                                            <div class="row-expr-block mt-1" style="display:none">\n                                                                <pre class="bg-slate-900 text-emerald-300 rounded-lg px-3 py-2 text-[11px] font-mono leading-relaxed overflow-x-auto whitespace-pre-wrap">{{ getRowExprContent(columnPermissionRules.find(r=>r.id===permissionApplyForm.roleId).tableRowRules[tableId].ruleId) }}</pre>\n                                                            </div>\n                                                        </template>\n                                                        <span v-else class="text-[11px] text-slate-400 italic">无行限制（全量数据）</span>\n                                                    </div>\n                                                </div>\n                                            </div>\n                                        </template>\n                                    </div>\n                                </div>\n                            </div>\n                        </div>\n                        <!-- 按表申请：展示表范围 -->\n                        <div v-else class="mb-5">\n                            <label class="text-sm font-semibold text-slate-700 mb-2 block">已选表范围</label>\n                            <div class="space-y-1">\n                                <div v-for="tbl in permissionApplyForm.selectedTables" :key="tbl.id" class="flex items-center gap-2 p-2 border border-slate-200 rounded bg-slate-50">\n                                    <span class="w-4 h-4 flex items-center justify-center rounded border bg-indigo-600 border-indigo-600">\n                                        <i class="ph ph-check e-700">审批流</span>\n                                <span class="text-[11px] text-slate-400">· 提交后将按以下流程审批</span>\n                            </div>\n                            <div class="flex items-center flex-wrap gap-1">\n                                <template v-for="(node, ni) in getApprovalFlow(columnPermissionRules.find(r=>r.id===permissionApplyForm.roleId)?.roleType, permissionApplyForm.sensitivityLevel, [])" :key="ni">\n                                    <span class="inline-flex items-center px-2 py-1 bg-white border border-slate-200 rounded text-xs text-slate-700">{{ node }}</span>\n                                    <i v-if="ni < getApprovalFlow(columnPermissionRules.find(r=>r.id===permissionApplyForm.roleId)?.roleType, permissionApplyForm.sensitivityLevel, []).length - 1" class="ph ph-caret-right text-slate-300 text-xs mx-0.5"></i>\n                                </template>\n                            </div>\n                        </div>\n                        <div class="flex gap-3">\n                            <button @click="showApplyFlow=false; permissionCenterTab=\'my_permissions\'" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-50">取消</button>\n                            <button @click="submitRenewal()"\n                                class="flex-1 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">提交续签申请</button>\n                        </div>\n                    </template>\n\n                    <!-- 新建申请模式 -->\n                    <template v-else>\n                    <div class="flex items-center gap-3 mb-4">\n                        <button @click="permissionApplyStep=1" class="text-slate-400 hover:text-indigo-600 transition-colors text-sm">返回</button>\n                        <div class="flex-1">\n                            <h2 class="text-lg font-semibold text-slate-800">选择角色</h2>\n                            <p class="text-xs text-slate-400 mt-0.5">域：{{ permissionApplyForm.domainName }}\n                                <template v-if="proxyApplyMode===\'proxy\' && proxyApplyTargetName">\n                                    · 替 <span class="font-medium text-indigo-600">{{ proxyApplyTargetName }}</span> 申请\n                                </template>\n                                · 可多选角色（最多 5 个）</p>\n                        </div>\n                        <!-- 已选数量浮动提示 -->\n                        <span v-if="selectedRoleIds.length > 0"\n                            class="px-3 py-1 bg-indigo-600 text-white rounded-full text-xs font-semibold">\n                            已选 {{ selectedRoleIds.length }} 个角色\n                        </span>\n                    </div>\n\n                    <!-- 代申请人提示横条 -->\n                    <div v-if="proxyApplyMode===\'proxy\' && proxyApplyTargetName"\n                        class="mb-3 px-3 py-2.5 bg-amber-50 border border-amber-200 rounded-lg flex items-center gap-2">\n                        <i class="ph ph-users text-amber-500 text-sm flex-shrink-0"></i>\n                        <span class="text-xs text-amber-800">\n                            当前为代申请模式，权限将授予\n                            <span class="font-semibold">{{ proxyApplyTargetName }}（{{ proxyApplyTargetDept }}）</span>，审批流将按其汇报关系路由\n                        </span>\n                    </div>\n\n                    <!-- 角色选择器：搜索下拉 -->\n                    <div class="mb-4 relative">\n                        <!-- 点击外部关闭遮罩 -->\n                        <div v-if="roleDropdownOpen" class="fixed inset-0 z-20" @mousedown="closeRoleDropdown()"></div>\n                        <!-- 触发输入框 -->\n                        <div class="relative">\n                            <div class="flex items-center gap-2 w-full px-3 py-2.5 border-2 rounded-xl cursor-text bg-white transition-all"\n                                :class="roleDropdownOpen ? \'border-indigo-500 ring-2 ring-indigo-100\' : \'border-slate-200 hover:border-indigo-300\'"\n                                @click="openRoleDropdown()">\n                                <i class="ph ph-magnifying-glass text-slate-400 text-sm flex-shrink-0"></i>\n                                <input v-model="roleSearchQuery"\n                                    placeholder="搜索并选择角色（最多 5 个）..."\n                                    class="flex-1 text-sm bg-transparent outline-none text-slate-700 placeholder-slate-400"\n                                    @focus="openRoleDropdown()">\n                                <span v-if="selectedRoleIds.length > 0"\n                                    class="flex-shrink-0 px-2 py-0.5 bg-indigo-600 text-white rounded-full text-xs font-semibold">\n                                    已选 {{ selectedRoleIds.length }}\n                                </span>\n                                <i class="ph flex-shrink-0 text-slate-400 text-sm transition-transform"\n                                    :class="roleDropdownOpen ? \'ph-caret-up\' : \'ph-caret-down\'"></i>\n                            </div>\n                            <!-- 下拉列表 -->\n                            <div v-if="roleDropdownOpen"\n                                class="absolute z-30 top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden"\n                                style="max-height: 320px; overflow-y: auto;">\n                                <div v-if="columnPermissionRules.filter(r => !roleSearchQuery || r.name.toLowerCase().includes(roleSearchQuery.toLowerCase())).length === 0"\n                                    class="px-4 py-8 text-center text-sm text-slate-400">\n                                    没有匹配的角色\n                                </div>\n                                <button v-for="rule in columnPermissionRules.filter(r => !roleSearchQuery || r.name.toLowerCase().includes(roleSearchQuery.toLowerCase()))"\n                                    :key="rule.id"\n                                    @mousedown.prevent="selectRoleFromDropdown(rule)"\n                                    class="flex items-center gap-3 w-full px-4 py-3 text-left border-b border-slate-50 last:border-b-0 transition-colors"\n                                    :class="selectedRoleIds.includes(rule.id) ? \'bg-indigo-50\' : \'hover:bg-slate-50\'">\n                                    <!-- checkbox -->\n                                    <div :class="[\'w-4 h-4 rounded border-2 flex items-center justify-center flex-shrink-0 transition-all\',\n                                        selectedRoleIds.includes(rule.id) ? \'border-indigo-600 bg-indigo-600\' : \'border-slate-300\']">\n                                        <i v-if="selectedRoleIds.includes(rule.id)" class="ph ph-check text-white" style="font-size:9px"></i>\n                                    </div>\n                                    <div class="flex-1 min-w-0">\n                                        <div class="flex items-center gap-2">\n                                            <span class="text-sm font-medium text-slate-800">{{ rule.name }}</span>\n                                            <span v-if="duplicateRoleIds.includes(rule.id)"\n                                                class="px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded text-[10px] font-medium">已有权限</span>\n                                        </div>\n                                        <div class="text-xs text-slate-500 mt-0.5 truncate">{{ rule.description }}</div>\n                                    </div>\n                                    <div class="flex items-center gap-2 flex-shrink-0">\n                                        <span class="text-xs text-slate-400">{{ Object.keys(rule.tableFields).length }} 张表</span>\n                                        <span :class="[\'px-2 py-0.5 rounded-full text-xs font-medium\', sensitivityLevelClass(rule.sensitivityLevel)]">\n                                            {{ sensitivityLevelLabel(rule.sensitivityLevel) }}\n                                        </span>\n                                    </div>\n                                </button>\n                            </div>\n                        </div>\n                        <p class="mt-1.5 text-xs text-slate-400 pl-1">最多同时选择 5 个角色，点击角色卡片可查看覆盖的表和字段</p>\n                    </div>\n\n                    <!-- 已选角色卡片列表 -->\n                    <div v-if="selectedRoleIds.length > 0" class="space-y-2 mb-4">\n                        <div v-for="roleId in selectedRoleIds" :key="roleId"\n                            class="border rounded-xl bg-white overflow-hidden transition-all"\n                            :class="expandedRoleDetailId===roleId ? \'border-indigo-400 ring-1 ring-indigo-200\' : \'border-slate-200\'">\n                            <!-- 卡片头 -->\n                            <div class="flex items-center gap-3 px-4 py-3">\n                                <!-- 移除按钮 -->\n                                <button @click="toggleMultiRoleSelection(columnPermissionRules.find(r=>r.id===roleId))"\n                                    class="w-5 h-5 rounded-full bg-slate-100 hover:bg-red-100 flex items-center justify-center flex-shrink-0 transition-colors group">\n                                    <i class="ph ph-x text-slate-400 group-hover:text-red-500" style="font-size:10px"></i>\n                                </button>\n                                <div class="flex-1 min-w-0">\n                                    <div class="flex items-center gap-2">\n                                        <span class="text-sm font-semibold text-slate-800">{{ columnPermissionRules.find(r=>r.id===roleId)?.name }}</span>\n                                        <span v-if="duplicateRoleIds.includes(roleId)"\n                                            class="px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded text-[10px] font-medium">已有生效权限</span>\n                                        <span :class="[\'px-2 py-0.5 rounded-full text-xs font-medium\', sensitivityLevelClass(columnPermissionRules.find(r=>r.id===roleId)?.sensitivityLevel)]">\n                                            {{ sensitivityLevelLabel(columnPermissionRules.find(r=>r.id===roleId)?.sensitivityLevel) }}\n                                        </span>\n                                    </div>\n                                    <div class="text-xs text-slate-500 mt-0.5">{{ columnPermissionRules.find(r=>r.id===roleId)?.description }}</div>\n                                </div>\n                                <div class="flex items-center gap-3 flex-shrink-0">\n                                    <span class="text-xs text-slate-400">{{ Object.keys(columnPermissionRules.find(r=>r.id===roleId)?.tableFields || {}).length }} 张表</span>\n                                    <!-- 展开/收起详情 -->\n                                    <button @click="toggleRoleDetailCard(roleId)"\n                                        class="flex items-center gap-1 text-xs text-slate-400 hover:text-indigo-600 transition-colors">\n                                        <span>{{ expandedRoleDetailId===roleId ? \'收起\' : \'查看详情\' }}</span>\n                                        <i :class="[\'ph text-sm\', expandedRoleDetailId===roleId ? \'ph-caret-up\' : \'ph-caret-down\']"></i>\n                                    </button>\n                                </div>\n                            </div>\n                            <!-- 展开详情：每张表的列权限 + 行权限 -->\n                            <div v-if="expandedRoleDetailId===roleId" class="border-t border-slate-100 bg-slate-50/80 px-3 py-3">\n                                <div class="space-y-2">\n                                    <template v-for="(fields, tableId) in columnPermissionRules.find(r=>r.id===roleId)?.tableFields" :key="tableId">\n                                        <div class="rounded-lg border border-slate-200 overflow-hidden bg-white">\n                                            <!-- 表名头部 -->\n                                            <div class="flex items-center gap-2 px-3 py-2 bg-slate-50 border-b border-slate-100">\n                                                <i class="ph ph-table text-slate-400 text-xs flex-shrink-0"></i>\n                                                <span class="text-xs font-semibold text-slate-700">{{ availableTablesForColumnPermission.find(t=>t.id===tableId)?.chineseName || tableId }}</span>\n                                                <span class="text-[11px] font-mono text-slate-400 truncate">{{ availableTablesForColumnPermission.find(t=>t.id===tableId)?.name || tableId }}</span>\n                                            </div>\n                                            <div class="px-3 py-2.5 space-y-2.5">\n                                                <!-- 列权限 -->\n                                                <div>\n                                                    <div class="text-[11px] font-medium text-slate-400 mb-1.5">列权限 · {{ fields.length }} 个字段</div>\n                                                    <div v-for="group in groupFieldsByCategory(fields, tableId, 10, 3).groups" :key="group.category" class="mb-1.5 last:mb-0">\n                                                        <div class="flex items-center gap-1 mb-1">\n                                                            <span class="text-[10px] font-medium text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">{{ group.category }}</span>\n                                                            <span class="text-[10px] text-slate-400">{{ group.count }}个</span>\n                                                        </div>\n                                                        <div class="flex flex-wrap gap-1">\n                                                            <span v-for="f in group.fields" :key="f.name" class="px-1.5 py-0.5 bg-indigo-50 text-indigo-700 rounded text-[11px]">{{ f.chineseName }}</span>\n                                                            <span v-if="group.overflowCount > 0" class="px-1.5 py-0.5 text-slate-400 rounded text-[11px] italic">...等 {{ group.count }} 个</span>\n                                                        </div>\n                                                    </div>\n                                                </div>\n                                                <!-- 行权限 -->\n                                                <div class="pt-1.5 border-t border-slate-100">\n                                                    <div class="text-[11px] font-medium text-slate-400 mb-1.5">行权限</div>\n                                                    <template v-if="columnPermissionRules.find(r=>r.id===roleId)?.tableRowRules?.[tableId]">\n                                                        <button @click="toggleRowExprDOM($event.currentTarget)"\n                                                            class="inline-flex items-center gap-1 px-2 py-0.5 bg-teal-50 border border-teal-200 text-teal-700 rounded-full text-[11px] font-medium cursor-pointer hover:bg-teal-100">\n                                                            <i class="ph ph-funnel text-[10px]"></i>\n                                                            {{ columnPermissionRules.find(r=>r.id===roleId).tableRowRules[tableId].rowRuleDesc }}\n                                                            <i class="ph ph-caret-down text-[10px] opacity-60"></i>\n                                                        </button>\n                                                        <div class="row-expr-block mt-1" style="display:none">\n                                                            <pre class="bg-slate-900 text-emerald-300 rounded-lg px-3 py-2 text-[11px] font-mono leading-relaxed overflow-x-auto whitespace-pre-wrap">{{ getRowExprContent(columnPermissionRules.find(r=>r.id===roleId).tableRowRules[tableId].ruleId) }}</pre>\n                                                        </div>\n                                                    </template>\n                                                    <span v-else class="text-[11px] text-slate-400 italic">无行限制（全量数据）</span>\n                                                </div>\n                                            </div>\n                                        </div>\n                                    </template>\n                                </div>\n                            </div>\n                        </div>\n                        <!-- 重复申请警告 -->\n                        <div v-if="duplicateRoleIds.length > 0" class="flex items-center gap-2 px-3 py-2 bg-amber-50 border border-amber-200 rounded-lg">\n                            <i class="ph ph-warning-circle text-amber-500 text-sm flex-shrink-0"></i>\n                            <span class="text-xs text-amber-700">{{ duplicateRoleIds.length }} 个角色已有生效权限，续签请从「我的权限」操作</span>\n                        </div>\n                    </div>\n                    <!-- 未选时占位提示 -->\n                    <div v-else class="mb-4 py-6 border-2 border-dashed border-slate-200 rounded-xl text-center text-sm text-slate-400">\n                        <i class="ph ph-user-circle text-2xl mb-1 block"></i>\n                        请在上方搜索并选择角色\n                    </div>\n\n                    <!-- 选中角色后：多角色行权限 Tab + 有效期 + 申请理由 + 审批流 -->\n                    <!-- 选中角色后：多角色行权限 Tab + 有效期 + 申请理由 + 审批流 -->\n                    <template v-if="selectedRoleIds.length > 0">\n                        <div class="mt-5 pt-5 border-t border-slate-200">\n\n                            <!-- 有效期 -->\n                            <div class="mb-4">\n                                <label class="text-sm font-semibold text-slate-700 mb-2 block">选择有效期\n                                    <span v-if="permissionApplyForm.sensitivityLevel===\'high_sensitive\' || permissionApplyForm.sensitivityLevel===\'top_sensitive\'"\n                                        class="text-xs font-normal text-orange-500 ml-1">（含高敏角色，最高 180 天）</span>\n                                </label>\n                                <div class="flex gap-2">\n                                    <button v-for="days in getValidityDays(null, permissionApplyForm.sensitivityLevel, [], false)" :key="days"\n                                        @click="permissionApplyForm.validityDays = days"\n                                        :class="[\'flex-1 py-2 rounded-lg border-2 text-sm font-medium\', permissionApplyForm.validityDays===days ? \'border-indigo-500 bg-indigo-50 text-indigo-700\' : \'border-slate-200 text-slate-600\']">{{ days }}天</button>\n                                </div>\n                            </div>\n                            <!-- 申请理由 -->\n                            <div class="mb-4">\n                                <label class="text-sm font-semibold text-slate-700 mb-2 block">申请理由 <span class="text-xs text-slate-400">（可选）</span></label>\n                                <textarea v-model="permissionApplyForm.reason" placeholder="请说明申请此权限的业务用途..."\n                                    class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 min-h-[60px] resize-none"></textarea>\n                            </div>\n                            <!-- 审批流预览：多角色时合并展示 -->\n                            <div class="mb-4 p-3 bg-blue-50/50 border border-blue-200 rounded-lg">\n                                <div class="flex items-center gap-1.5 mb-2">\n                                    <i class="ph ph-path text-blue-500 text-sm"></i>\n                                    <span class="text-xs font-semibold text-slate-700">审批流</span>\n                                    <span v-if="selectedRoleIds.length > 1" class="text-[11px] text-blue-600 bg-blue-100 px-1.5 py-0.5 rounded font-medium">多角色已合并</span>\n                                    <span class="text-[11px] text-slate-400">· 提交后将按以下流程审批</span>\n                                </div>\n                                <div class="flex items-center flex-wrap gap-1">\n                                    <template v-for="(node, ni) in getApprovalFlow(columnPermissionRules.find(r=>r.id===permissionApplyForm.roleId)?.roleType, permissionApplyForm.sensitivityLevel, [])" :key="ni">\n                                        <span class="inline-flex items-center px-2 py-1 bg-white border border-slate-200 rounded text-xs text-slate-700">{{ node }}</span>\n                                        <i v-if="ni < getApprovalFlow(columnPermissionRules.find(r=>r.id===permissionApplyForm.roleId)?.roleType, permissionApplyForm.sensitivityLevel, []).length - 1" class="ph ph-caret-right text-slate-300 text-xs mx-0.5"></i>\n                                    </template>\n                                </div>\n                            </div>\n                        </div>\n                    </template>\n\n                    <!-- 底部操作 -->\n                    <div class="mt-6 flex gap-3">\n                        <button @click="permissionApplyStep=1" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-50">返回</button>\n                        <button @click="submitPermissionApplication()"\n                            :disabled="selectedRoleIds.length === 0"\n                            :class="[\'flex-1 py-2 rounded-lg text-sm font-medium transition-colors\',\n                                selectedRoleIds.length > 0 ? \'bg-indigo-600 text-white hover:bg-indigo-700\' : \'bg-slate-200 text-slate-400 cursor-not-allowed\']">\n                            提交申请（{{ selectedRoleIds.length }} 个角色）\n                        </button>\n                    </div>\n                    </template>\n                </div>\n            </template>\n\n            <!-- 非标权限申请（按表） -->\n            <template v-if="permissionApplyType === \'custom\'">\n                <!-- Step2: 选择数据表 -->\n                <div v-if="permissionApplyStep === 2">\n                    <div class="flex items-center gap-3 mb-4">\n                        <button @click="permissionApplyStep=1" class="text-slate-400 hover:text-indigo-600 transition-colors text-sm">返回</button>\n                        <div class="flex-1">\n                            <h2 class="text-lg font-semibold text-slate-800">选择数据表</h2>\n                            <p class="text-xs text-slate-400 mt-0.5">域：{{ permissionApplyForm.domainName }} · 可多选，按目录快速定位</p>\n                        </div>\n                        <span v-if="customApplySelectedTableIds.length>0" class="text-xs text-indigo-600 font-medium">已选 {{ customApplySelectedTableIds.length }} 张表</span>\n                    </div>\n                    <!-- 分类快速过滤 -->\n                    <div class="flex flex-wrap gap-2 mb-3">\n                        <button v-for="cat in [\'全部\',\'员工\',\'组织\',\'职级\',\'晋升\']" :key="cat"\n                            @click="customApplyTableCategory=cat"\n                            :class="[\'px-3 py-1 rounded-full text-xs font-medium border transition-all\',\n                                customApplyTableCategory===cat ? \'bg-indigo-600 text-white border-indigo-600\' : \'bg-white text-slate-600 border-slate-200 hover:border-indigo-400\']">\n                            {{ cat }}\n                        </button>\n                    </div>\n                    <!-- 展开/收起全部 -->\n                    <div class="flex items-center gap-3 mb-3">\n                        <button @click="expandAllTableDirs()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">展开全部</button>\n                        <button @click="collapseAllTableDirs()" class="text-xs text-slate-400 hover:text-slate-600">收起全部</button>\n                    </div>\n                    <!-- 表列表：按目录（文件夹）分组 -->\n                    <div class="space-y-2 mb-4 max-h-[420px] overflow-y-auto">\n                        <div v-for="(tables, dirName) in groupedTablesByDir" :key="dirName" class="border border-slate-200 rounded-lg overflow-hidden">\n                            <!-- 目录标题行 -->\n                            <button @click="toggleTableDir(dirName)"\n                                :class="[\'flex items-center gap-2 w-full px-3 py-2.5 text-left transition-all\',\n                                    expandedTableDirs[dirName] ? \'bg-indigo-50 text-indigo-700\' : \'bg-white text-slate-700 hover:bg-slate-50\']">\n                                <i :class="[\'ph text-sm transition-transform\', expandedTableDirs[dirName] ? \'ph-folder-open text-indigo-500\' : \'ph-folder text-slate-400\']"></i>\n                                <span class="text-sm font-semibold">{{ dirName }}</span>\n                                <span class="text-xs text-slate-400 ml-1">（{{ tables.length }} 张表）</span>\n                                <i :class="[\'ph ph-caret-down text-xs ml-auto transition-transform\', expandedTableDirs[dirName] ? \'rotate-180 text-indigo-500\' : \'text-slate-400\']"></i>\n                            </button>\n                            <!-- 目录下的表列表 -->\n                            <div v-if="expandedTableDirs[dirName]" class="border-t border-slate-100 bg-white">\n                                <label v-for="tbl in tables" :key="tbl.id"\n                                    :class="[\'flex items-center gap-3 px-3 py-2 cursor-pointer transition-all border-b border-slate-50 last:border-b-0\',\n                                        customApplySelectedTableIds.includes(tbl.id) ? \'bg-indigo-50/50\' : \'hover:bg-slate-50\']">\n                                    <input type="checkbox" v-model="customApplySelectedTableIds" :value="tbl.id" class="rounded text-indigo-600 flex-shrink-0">\n                                    <div class="flex-1 min-w-0">\n                                        <div class="text-sm font-medium text-slate-800 truncate">{{ tbl.name }}</div>\n                                        <div class="text-xs text-slate-500">{{ tbl.chineseName }}</div>\n                                    </div>\n                                    <span class="text-[11px] text-slate-400 flex-shrink-0">{{ tbl.fields.length }} 字段</span>\n                                </label>\n                            </div>\n                        </div>\n                        <!-- 空状态 -->\n                        <div v-if="Object.keys(groupedTablesByDir).length === 0" class="py-8 text-center text-slate-400">\n                            <p class="text-sm">该分类下暂无数据表</p>\n                        </div>\n                    </div>\n                    <div class="flex gap-3">\n                        <button @click="permissionApplyStep=1" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-50">返回</button>\n                        <button @click="startCustomApplyConfig()"\n                            :disabled="customApplySelectedTableIds.length === 0"\n                            class="flex-1 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50">\n                            下一步，配置字段和行权限\n                        </button>\n                    </div>\n                </div>\n\n                <!-- Step3: 逐表配置字段 + 行权限 -->\n                <div v-else-if="permissionApplyStep === 3">\n                    <div class="flex items-center gap-3 mb-4">\n                        <button @click="customApplyConfigIndex > 0 ? customApplyPrevTable() : permissionApplyStep=2" class="text-slate-400 hover:text-indigo-600 transition-colors text-sm">返回</button>\n                        <div class="flex-1">\n                            <div class="flex items-center gap-2">\n                                <h2 class="text-lg font-semibold text-slate-800">配置字段与行权限</h2>\n                                <span class="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">{{ customApplyConfigIndex + 1 }} / {{ permissionApplyForm.selectedTables.length }}</span>\n                            </div>\n                        </div>\n                    </div>\n\n                    <!-- 表标签导航 -->\n                    <div class="flex gap-1 mb-4 overflow-x-auto pb-1">\n                        <button v-for="(tbl, idx) in permissionApplyForm.selectedTables" :key="tbl.id"\n                            @click="goToCustomTable(idx)"\n                            :class="[\'flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium border transition-all\',\n                                customApplyConfigIndex===idx ? \'bg-indigo-600 text-white border-indigo-600\' : \'bg-white text-slate-600 border-slate-200 hover:border-indigo-400\']">\n                            {{ tbl.name }}\n                        </button>\n                    </div>\n\n                    <!-- 当前配置表 -->\n                    <template v-if="permissionApplyForm.selectedTables[customApplyConfigIndex]">\n                    <div class="border border-indigo-200 rounded-lg">\n                        <!-- 表名 header -->\n                        <div class="px-4 py-3 bg-indigo-50 border-b border-indigo-100 flex items-center justify-between">\n                            <div>\n                                <span class="text-sm font-semibold text-indigo-800">{{ permissionApplyForm.selectedTables[customApplyConfigIndex].name }}</span>\n                                <span class="text-xs text-indigo-500 ml-2">{{ permissionApplyForm.selectedTables[customApplyConfigIndex].chineseName }}</span>\n                            </div>\n                            <span class="text-xs text-slate-400">{{ (permissionApplyForm.selectedFields[permissionApplyForm.selectedTables[customApplyConfigIndex].id]||[]).length }} / {{ availableTablesForColumnPermission.find(t=>t.id===permissionApplyForm.selectedTables[customApplyConfigIndex].id)?.fields.length || 0 }} 字段已选</span>\n                        </div>\n\n                        <!-- ═══ 列权限 ═══ -->\n                        <div class="p-4 border-b-4 border-slate-200 bg-white">\n                            <div class="flex items-center justify-between mb-3">\n                                <div class="flex items-center gap-2">\n                                    <div class="w-1 h-4 bg-indigo-500 rounded-full"></div>\n                                    <label class="text-sm font-semibold text-slate-700">列权限</label>\n                                    <span class="text-xs text-red-500 font-medium">必填</span>\n                                    <span class="text-xs text-slate-400">· 勾选用户可访问的字段</span>\n                                </div>\n                                <div class="flex items-center gap-2">\n                                    <input :value="customApplyFieldSearch[permissionApplyForm.selectedTables[customApplyConfigIndex].id]||\'\'"\n                                        @input="e => customApplyFieldSearch[permissionApplyForm.selectedTables[customApplyConfigIndex].id]=e.target.value"\n                                        placeholder="搜索字段..."\n                                        class="px-2 py-1 border border-slate-200 rounded text-xs w-32 focus:ring-1 focus:ring-indigo-400">\n                                    <button @click="() => {\n                                        const tblId = permissionApplyForm.selectedTables[customApplyConfigIndex].id;\n                                        const all = availableTablesForColumnPermission.find(t=>t.id===tblId)?.fields.map(f=>f.name)||[];\n                                        permissionApplyForm.selectedFields[tblId] = all;\n                                    }" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">全选</button>\n                                    <button @click="() => {\n                                        const tblId = permissionApplyForm.selectedTables[customApplyConfigIndex].id;\n                                        const partitionFields = (availableTablesForColumnPermission.find(t=>t.id===tblId)?.fields||[]).filter(f=>f.is_partition).map(f=>f.name);\n                                        permissionApplyForm.selectedFields[tblId] = partitionFields;\n                                    }" class="text-xs text-slate-400 hover:text-slate-600">清空</button>\n                                </div>\n                            </div>\n                            <!-- 按分类展示字段 -->\n                            <div class="space-y-3 max-h-96 overflow-y-auto">\n                                <template v-for="cat in Object.keys(hrFieldCategories || {})" :key="cat">\n                                    <div v-if="(availableTablesForColumnPermission.find(t=>t.id===permissionApplyForm.selectedTables[customApplyConfigIndex].id)?.fields||[]).filter(f=>f.category===cat && (!(customApplyFieldSearch[permissionApplyForm.selectedTables[customApplyConfigIndex].id])||f.name.toLowerCase().includes((customApplyFieldSearch[permissionApplyForm.selectedTables[customApplyConfigIndex].id]||\'\').toLowerCase()))).length > 0">\n                                        <div class="flex items-center justify-between mb-1">\n                                            <span class="text-xs font-semibold text-slate-500">{{ cat }}</span>\n                                            <button @click="() => {\n                                                const tblId = permissionApplyForm.selectedTables[customApplyConfigIndex].id;\n                                                const catFields = (availableTablesForColumnPermission.find(t=>t.id===tblId)?.fields||[]).filter(f=>f.category===cat).map(f=>f.name);\n                                                const partitionFields = (availableTablesForColumnPermission.find(t=>t.id===tblId)?.fields||[]).filter(f=>f.is_partition).map(f=>f.name);\n                                                const cur = permissionApplyForm.selectedFields[tblId]||[];\n                                                const allSelected = catFields.every(f=>cur.includes(f));\n                                                if(allSelected) {\n                                                    permissionApplyForm.selectedFields[tblId] = cur.filter(f=>!catFields.includes(f) || partitionFields.includes(f));\n                                                } else {\n                                                    permissionApplyForm.selectedFields[tblId] = [...new Set([...cur,...catFields])];\n                                                }\n                                            }" class="text-[11px] text-indigo-500 hover:text-indigo-700">全选此分类</button>\n                                        </div>\n                                        <div class="flex flex-wrap gap-1">\n                                            <label v-for="field in (availableTablesForColumnPermission.find(t=>t.id===permissionApplyForm.selectedTables[customApplyConfigIndex].id)?.fields||[]).filter(f=>f.category===cat && (!(customApplyFieldSearch[permissionApplyForm.selectedTables[customApplyConfigIndex].id])||f.name.toLowerCase().includes((customApplyFieldSearch[permissionApplyForm.selectedTables[customApplyConfigIndex].id]||\'\').toLowerCase())))"\n                                                :key="field.name"\n                                                :class="[\'flex items-center gap-0.5 px-1.5 py-0.5 border rounded text-[11px] transition-all\',\n                                                    field.is_partition ? \'cursor-default border-violet-400 bg-violet-50 text-violet-700 font-medium\' :\n                                                    (permissionApplyForm.selectedFields[permissionApplyForm.selectedTables[customApplyConfigIndex].id]||[]).includes(field.name)\n                                                        ? \'cursor-pointer border-indigo-400 bg-indigo-50 text-indigo-700 font-medium\'\n                                                        : \'cursor-pointer border-slate-200 text-slate-600 hover:border-indigo-300\']"\n                                                @click="() => {\n                                                    if(field.is_partition) return;\n                                                    const tblId = permissionApplyForm.selectedTables[customApplyConfigIndex].id;\n                                                    if(!permissionApplyForm.selectedFields[tblId]) permissionApplyForm.selectedFields[tblId]=[];\n                                                    const idx2 = permissionApplyForm.selectedFields[tblId].indexOf(field.name);\n                                                    if(idx2===-1) permissionApplyForm.selectedFields[tblId].push(field.name);\n                                                    else permissionApplyForm.selectedFields[tblId].splice(idx2,1);\n                                                }">\n                                                <i v-if="field.is_partition" class="ph ph-lock text-violet-500 text-[9px]"></i>\n                                                <i v-else-if="field.is_unique_key && (permissionApplyForm.selectedFields[permissionApplyForm.selectedTables[customApplyConfigIndex].id]||[]).includes(field.name)" class="ph ph-key text-amber-500 text-[9px]"></i>\n                                                <span>{{ (hrFieldChineseNameMap[field.name] || field.name) }}</span>\n                                                <span v-if="field.securityLevel" :class="[\'text-[9px] px-1 py-px rounded-sm font-medium ml-0.5\',\n                                                    field.securityLevel === \'C4\' ? \'bg-red-100 text-red-600\' :\n                                                    field.securityLevel === \'C3\' ? \'bg-orange-100 text-orange-600\' :\n                                                    \'bg-slate-100 text-slate-500\']">{{ field.securityLevel }}</span>\n                                                <span v-if="field.is_partition" class="text-[9px] text-violet-400 ml-0.5">分区</span>\n                                                <span v-if="field.is_unique_key" class="text-[9px] text-amber-400 ml-0.5">唯一键</span>\n                                            </label>\n                                        </div>\n                                    </div>\n                                </template>\n                            </div>\n                        </div>\n\n                        <!-- ═══ 行权限 ═══ -->\n                        <div class="p-4 bg-slate-50">\n                            <div class="flex items-center gap-2 mb-3">\n                                <div class="w-1 h-4 bg-emerald-500 rounded-full"></div>\n                                <label class="text-sm font-semibold text-slate-700">行权限配置</label>\n                                <!-- 模式切换：结构化配置 / 自定义行权限 -->\n                                <div class="ml-1 inline-flex items-center rounded-lg border border-slate-200 bg-white p-0.5">\n                                    <button @click="currentRowPermForm.mode = \'structured\'"\n                                        :class="[\'px-2.5 py-1 rounded-md text-xs font-medium transition-colors flex items-center gap-1\',\n                                            currentRowPermForm.mode === \'structured\' ? \'bg-indigo-600 text-white\' : \'text-slate-600 hover:text-slate-900\']">\n                                        <i class="ph ph-sliders-horizontal text-xs"></i>结构化配置\n                                    </button>\n                                    <button @click="currentRowPermForm.mode = \'custom\'"\n                                        :class="[\'px-2.5 py-1 rounded-md text-xs font-medium transition-colors flex items-center gap-1\',\n                                            currentRowPermForm.mode === \'custom\' ? \'bg-indigo-600 text-white\' : \'text-slate-600 hover:text-slate-900\']">\n                                        <i class="ph ph-code text-xs"></i>自定义行权限\n                                    </button>\n                                </div>\n                                <!-- 多表时：应用到所有表按钮 -->\n                                <button v-if="permissionApplyForm.selectedTables.length > 1"\n                                    @click="copyRowPermToOtherTables"\n                                    class="ml-auto flex items-center gap-1 text-xs text-indigo-600 hover:text-indigo-800 font-medium px-2 py-1 rounded-lg border border-indigo-200 hover:bg-indigo-50 transition-colors">\n                                    <i class="ph ph-copy text-xs"></i>应用到所有表\n                                </button>\n                            </div>\n                            <!-- 自动复用 banner 提示 -->\n                            <div v-if="customApplyRowPermAutoFilled[permissionApplyForm.selectedTables[customApplyConfigIndex].id]" class="mb-3 p-2.5 bg-emerald-50 border border-emerald-200 rounded-lg flex items-center gap-2">\n                                <i class="ph ph-info text-emerald-600 text-sm"></i>\n                                <span class="text-xs text-emerald-700">已自动复用上一张表的行权限，可按需修改</span>\n                                <button @click="customApplyRowPermAutoFilled[permissionApplyForm.selectedTables[customApplyConfigIndex].id] = false" class="ml-auto text-emerald-600 hover:text-emerald-800"><i class="ph ph-x text-xs"></i></button>\n                            </div>\n\n                            <div class="space-y-3" v-if="currentRowPermForm && currentRowPermForm.mode === \'structured\'">\n                                <!-- 动态条件列表：只显示 activeConditions 中的条件（pending中的不重复显示） -->\n                                <template v-for="condKey in currentRowPermForm.activeConditions" :key="condKey">\n                                    <!-- 如果该条件正在 pending 行中编辑，跳过卡片展示 -->\n                                    <template v-if="condKey !== pendingRowPermCondition">\n                                    <!-- 所在组织（默认展示，不可删除） -->\n                                    <div v-if="condKey === \'org\'" class="bg-white rounded-lg border border-slate-200 p-3">\n                                        <div class="flex items-center gap-2 mb-1.5">\n                                            <label class="text-xs font-semibold text-slate-700">所在组织</label>\n                                            <span class="text-xs text-red-500 font-medium">必填</span>\n                                            <span class="text-[10px] text-slate-400">单个条件内多选取并集</span>\n                                        </div>\n                                        <div class="relative">\n                                            <input v-model="currentRowPermForm.orgSearch"\n                                                placeholder="请搜索部门"\n                                                :class="[\'w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-400\', currentRowPermForm.org.length === 0 ? \'border-red-300 focus:border-red-400 focus:ring-red-200\' : \'border-slate-200 focus:border-indigo-400\']">\n                                            <i class="ph ph-caret-down absolute right-3 top-2.5 text-slate-400 text-sm"></i>\n                                        </div>\n                                        <div v-if="currentRowPermForm.org.length>0" class="flex flex-wrap gap-1 mt-1.5">\n                                            <span v-for="o in currentRowPermForm.org" :key="o"\n                                                class="inline-flex items-center gap-1 px-2 py-0.5 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded text-xs">\n                                                {{ o }}\n                                                <button @click="currentRowPermForm.org = currentRowPermForm.org.filter(x=>x!==o)" class="hover:text-red-500"><i class="ph ph-x text-[10px]"></i></button
