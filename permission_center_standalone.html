d.key===\'family\').options" :key="f">{{ f }}</option>\n                                            </select>\n                                            <i class="ph ph-caret-down absolute right-3 top-2.5 text-slate-400 text-sm pointer-events-none"></i>\n                                        </div>\n                                        <div v-if="currentRowPermForm.family.length>0" class="flex flex-wrap gap-1 mt-1.5">\n                                            <span v-for="f in currentRowPermForm.family" :key="f"\n                                                class="inline-flex items-center gap-1 px-2 py-0.5 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded text-xs">\n                                                {{ f }}\n                                                <button @click="currentRowPermForm.family = currentRowPermForm.family.filter(x=>x!==f)" class="hover:text-red-500"><i class="ph ph-x text-[10px]"></i></button>\n                                            </span>\n                                        </div>\n                                    </div>\n                                    <!-- 通道 -->\n                                    <div v-else-if="condKey === \'channel\'" class="bg-white rounded-lg border border-slate-200 p-3">\n                                        <div class="flex items-center justify-between mb-1.5">\n                                            <label class="text-xs font-semibold text-slate-700">通道</label>\n                                            <div class="flex items-center gap-1">\n                                                <span class="text-[10px] text-slate-400">单个条件内多选取并集</span>\n                                                <button @click="removeRowPermCondition(permissionApplyForm.selectedTables[customApplyConfigIndex].id, \'channel\')" class="text-slate-400 hover:text-red-500 ml-1" title="移除此条件"><i class="ph ph-x-circle text-xs"></i></button>\n pression.trim() === \'\') ? \'border-red-300 focus:border-red-400 focus:ring-red-200\' : \'border-slate-200 focus:border-indigo-400 focus:ring-indigo-400\']"></textarea>\n                                    <p v-if="!currentRowPermForm.customExpression || currentRowPermForm.customExpression.trim() === \'\'" class="text-[11px] text-red-500 mt-1.5"><i class="ph ph-warning-circle text-xs mr-0.5"></i>请输入自定义行权限</p>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    </template>\n\n                    <!-- 底部操作 -->\n                    <div class="mt-4">\n                        <!-- 逐表切换导航 -->\n                        <div v-if="permissionApplyForm.selectedTables.length > 1 && customApplyConfigIndex < permissionApplyForm.selectedTables.length - 1" class="flex gap-3 mb-3">\n                            <button @click="customApplyNextTable()" class="flex-1 py-2 border-2 border-indigo-400 text-indigo-600 rounded-lg text-sm font-medium hover:bg-indigo-50">\n                                下一张表 <i class="ph ph-arrow-right text-xs"></i>\n                            </button>\n                        </div>\n                        <!-- 最后一张表才显示提交相关 -->\n                        <div v-if="customApplyConfigIndex === permissionApplyForm.selectedTables.length - 1">\n                            <div class="mb-3">\n                                <label class="text-sm font-semibold text-slate-700 mb-2 block">选择有效期</label>\n                                <div class="flex gap-2">\n                                    <button v-for="days in getValidityDays(null, permissionApplyForm.sensitivityLevel, null, true)" :key="days" @click="permissionApplyForm.validityDays=days"\n                                        :class="[\'flex-1 py-2 rounded-lg border-2 text-sm font-medium\', permissionApplyForm.validityDays===days ? \'border-indigo-500 bg-indigo-50 text-indigo-700\' : \'border-slate-200 text-slate-600\']">{{ days }}天</button>\n                                </div>\n                                <p v-if="shouldHide365Validity(null, permissionApplyForm.sensitivityLevel, null, true)" class="text-[11px] text-amber-500 mt-1.5">\n                                    <i class="ph ph-warning-circle text-xs mr-0.5"></i>当前权限涉及高敏字段或 E14+ 职级，最长有效期 180 天\n                                </p>\n                            </div>\n                            <div class="mb-3">\n                                <label class="text-sm font-semibold text-slate-700 mb-2 block">申请理由 <span class="text-xs text-slate-400">（可选）</span></label>\n                                <textarea v-model="permissionApplyForm.reason" placeholder="请说明申请此权限的业务用途..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 min-h-[60px] resize-none"></textarea>\n                            </div>\n                            <!-- 审批流预览 -->\n                            <div class="mb-3 p-3 bg-blue-50/50 border border-blue-200 rounded-lg">\n                                <div class="flex items-center gap-1.5 mb-2">\n                                    <i class="ph ph-path text-blue-500 text-sm"></i>\n                                    <span class="text-xs font-semibold text-slate-700">审批流</span>\n                                    <span class="text-[11px] text-slate-400">· 提交后将按以下流程审批</span>\n                                </div>\n                                <div class="flex items-center flex-wrap gap-1">\n                                    <template v-for="(node, ni) in getApprovalFlow(null, permissionApplyForm.sensitivityLevel || \'sensitive\', customRowPermNeedsBPH())" :key="ni">\n                                        <span class="inline-flex items-center px-2 py-1 bg-white border border-slate-200 rounded text-xs text-slate-700">{{ node }}</span>\n                                        <i v-if="ni < getApprovalFlow(null, permissionApplyForm.sensitivityLevel || \'sensitive\', customRowPermNeedsBPH()).length - 1" class="ph ph-caret-right text-slate-300 text-xs mx-0.5"></i>\n                                    </template>\n                                </div>\n                            </div>\n                            <div class="flex gap-3">\n                                <button @click="permissionApplyStep=2" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-50">上一步</button>\n                                <button @click="submitPermissionApplication()" :disabled="!currentRowPermForm || permissionApplyForm.selectedTables.some(t => { const f = customApplyRowPermForm[t.id]; if (!f) return true; if (f.mode === \'custom\') return !f.customExpression || f.customExpression.trim() === \'\'; return !f.org || f.org.length === 0; })" class="flex-1 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50">提交申请</button>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n            </template>\n\n            <!-- 复制他人权限 -->\n            <template v-if="permissionApplyType === \'copy\'">\n                <div v-if="permissionApplyStep === 2">\n                    <div class="flex items-center gap-3 mb-4">\n                        <button @click="permissionApplyStep=1" class="text-slate-400 hover:text-indigo-600 transition-colors text-sm">返回</button>\n                        <div class="flex-1">\n                            <h2 class="text-lg font-semibold text-slate-800">复制他人权限</h2>\n                            <p class="text-xs text-slate-400 mt-0.5">选择用户后，勾选需要复制的标准角色</p>\n                        </div>\n                    </div>\n                    <!-- 选择用户 -->\n                    <div class="mb-5">\n                        <label class="text-sm font-semibold text-slate-700 mb-2 block">选择用户</label>\n                        <select :value="copyPermissionSelectedUserId" @change="selectCopyPermissionUser($event.target.value)" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 bg-white">\n                            <option value="">请选择用户</option>\n                            <option v-for="u in copyPermissionUsers" :key="u.id" :value="u.id">{{ u.name }}（{{ u.userName }} · {{ u.department }}）</option>\n                        </select>\n                    </div>\n\n                    <!-- 选中用户后直接展示所有内容 -->\n                    <template v-if="copyPermissionSelectedUserId && copyUserStandardRoles.length > 0">\n                        <!-- ═══ 标准角色 ═══ -->\n                        <div v-if="copyUserStandardRoles.length > 0" class="mb-5">\n                            <div class="flex items-center justify-between mb-2">\n                                <label class="text-sm font-semibold text-slate-700">标准角色权限</label>\n                                <div class="flex items-center gap-3">\n                                    <button @click="selectAllCopyRoles()" v-if="copyPermissionSelectedRoleIds.length < copyUserStandardRoles.length" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">全选</button>\n                                    <button @click="clearAllCopyRoles()" v-if="copyPermissionSelectedRoleIds.length > 0" class="text-xs text-slate-400 hover:text-slate-600">清空</button>\n                                </div>\n                            </div>\n                            <div class="space-y-2 max-h-[50vh] overflow-y-auto pr-1">\n                                <div v-for="role in copyUserStandardRoles" :key="role.roleId"\n                                    :class="[\'border rounded-lg bg-white overflow-hidden transition-all\', copyPermissionSelectedRoleIds.includes(role.roleId) ? \'border-indigo-500 ring-2 ring-indigo-200\' : \'border-slate-200\']">\n                                    <!-- 角色标题行：checkbox + 角色名 + 敏感等级 + 展开按钮 -->\n                                    <div class="flex items-center gap-3 p-3">\n                                        <input type="checkbox"\n                                            :checked="copyPermissionSelectedRoleIds.includes(role.roleId)"\n                                            @change="toggleCopyRoleSelection(role.roleId)"\n                                            class="rounded text-indigo-600 flex-shrink-0">\n                                        <div class="flex-1 min-w-0">\n                                            <div class="flex items-center gap-2">\n                                                <div class="text-sm font-medium text-slate-800">{{ role.roleName }}</div>\n                                                <span :class="[\'px-2 py-0.5 rounded-full text-xs font-medium flex-shrink-0\', sensitivityLevelClass(role.sensitivityLevel)]">{{ sensitivityLevelLabel(role.sensitivityLevel) }}</span>\n                                            </div>\n                                            <div class="text-xs text-slate-400 mt-0.5">覆盖 {{ Object.keys(role.tableFields || {}).length }} 张表</div>\n                                        </div>\n                                        <button @click="toggleCopyRoleExpand(role.roleId)" class="flex items-center gap-1 text-xs text-slate-400 hover:text-indigo-600 transition-colors flex-shrink-0 px-1">\n                                            <span>{{ copyExpandedRoleId===role.roleId ? \'收起\' : \'查看详情\' }}</span>\n                                            <i :class="[\'ph text-sm\', copyExpandedRoleId===role.roleId ? \'ph-caret-up\' : \'ph-caret-down\']"></i>\n                                        </button>\n                                    </div>\n                                    <!-- 行权限（跟着角色展示，仅当选了该角色时） -->\n                                    <div v-if="copyPermissionSelectedRoleIds.includes(role.roleId)" class="border-t border-slate-100 bg-slate-50/50 px-4 py-3">\n                                    </div>\n                                    <!-- 展开详情：覆盖的表和字段 -->\n                                    <div v-if="copyExpandedRoleId===role.roleId" class="border-t border-slate-100 bg-slate-50 px-4 py-3">\n                                        <div class="space-y-4">\n                                            <template v-for="(fields, tableId) in role.tableFields" :key="tableId">\n                                            <div>\n                                                <div class="text-xs font-semibold text-slate-600 mb-1.5">\n                                                    <i class="ph ph-table text-slate-400 mr-1"></i>\n                                                    {{ availableTablesForColumnPermission.find(t=>t.id===tableId)?.name || tableId }}\n                                                    <span class="font-normal text-slate-400 ml-1">{{ availableTablesForColumnPermission.find(t=>t.id===tableId)?.chineseName }}</span>\n                                                    <span class="font-normal text-slate-400 ml-1">· {{ fields.length }} 个字段</span>\n                                                </div>\n                                                <div v-for="group in groupFieldsByCategory(fields, tableId, 10, 3).groups" :key="group.category" class="mb-2 last:mb-0">\n                                                    <div class="flex items-center gap-1.5 mb-1">\n                                                        <span class="text-[11px] font-medium text-slate-500 bg-slate-200 px-1.5 py-0.5 rounded">{{ group.category }}</span>\n                                                        <span class="text-[11px] text-slate-400">{{ group.count }}个</span>\n                                                    </div>\n                                                    <div class="flex flex-wrap gap-1">\n                                                        <span v-for="f in group.fields" :key="f.name" class="px-1.5 py-0.5 bg-indigo-50 text-indigo-700 rounded text-[11px]">{{ f.chineseName }}</span>\n                                                        <span v-if="group.overflowCount > 0" class="px-1.5 py-0.5 text-slate-400 rounded text-[11px] italic">... 等{{ group.count }}个字段</span>\n                                                    </div>\n                                                </div>\n                                                <div v-if="groupFieldsByCategory(fields, tableId, 10, 3).overflowCategoryCount > 0" class="text-[11px] text-slate-400 italic mt-1">\n                                                    ...\n                                                </div>\n                                            </div>\n                                            </template>\n                                        </div>\n                                    </div>\n                                </div>\n                            </div>\n                        </div>\n\n\n\n                        <!-- 有效期 -->\n                        <div class="mb-4">\n                            <label class="text-sm font-semibold text-slate-700 mb-2 block">选择有效期</label>\n                            <div class="flex gap-2">\n                                <button v-for="days in [7, 30, 90, 180, 365]" :key="days" @click="permissionApplyForm.validityDays=days" :class="[\'flex-1 py-2 rounded-lg border-2 text-sm font-medium\', permissionApplyForm.validityDays===days ? \'border-indigo-500 bg-indigo-50 text-indigo-700\' : \'border-slate-200 text-slate-600\']">{{ days }}天</button>\n                            </div>\n                        </div>\n                        <!-- 申请理由 -->\n                        <div class="mb-4">\n                            <label class="text-sm font-semibold text-slate-700 mb-2 block">申请理由 <span class="text-xs text-slate-400">（可选）</span></label>\n                            <textarea v-model="permissionApplyForm.reason" placeholder="请说明复制该用户权限的业务用途..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 min-h-[60px] resize-none"></textarea>\n                        </div>\n                        <!-- 审批流预览 -->\n                        <div class="mb-4 p-3 bg-blue-50/50 border border-blue-200 rounded-lg">\n                            <div class="flex items-center gap-1.5 mb-2">\n                                <i class="ph ph-path text-blue-500 text-sm"></i>\n                                <span class="text-xs font-semibold text-slate-700">审批流</span>\n                                <span class="text-[11px] text-slate-400">· 提交后将按以下流程审批</span>\n                            </div>\n                            <div class="flex items-center flex-wrap gap-1">\n                                <template v-for="(node, ni) in getApprovalFlow(null, permissionApplyForm.sensitivityLevel || \'basic\', rowPermNeedsBPH(copyAllRowPermIds))" :key="ni">\n                                    <span class="inline-flex items-center px-2 py-1 bg-white border border-slate-200 rounded text-xs text-slate-700">{{ node }}</span>\n                                    <i v-if="ni < getApprovalFlow(null, permissionApplyForm.sensitivityLevel || \'basic\', rowPermNeedsBPH(copyAllRowPermIds)).length - 1" class="ph ph-caret-right text-slate-300 text-xs mx-0.5"></i>\n                                </template>\n                            </div>\n                        </div>\n                    </template>\n\n                    <!-- 选中用户但无任何可复制权限 -->\n                    <div v-if="copyPermissionSelectedUserId && copyUserStandardRoles.length === 0" class="mb-5 text-sm text-slate-400 py-6 text-center border border-dashed border-slate-200 rounded-lg">\n                        该用户暂无可复制的标准角色\n                    </div>\n\n                    <!-- 提交按钮 -->\n                    <div class="mt-8 flex gap-3">\n                        <button @click="permissionApplyStep=1" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-50">返回</button>\n                        <button @click="submitCopyPermissionApplication()" :disabled="copyPermissionSelectedRoleIds.length===0" class="flex-1 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50">提交申请</button>\n                    </div>\n                </div>\n            </template>\n        </div>\n\n        <!-- ===== 我的申请列表 ===== -->\n        <div v-else>\n            <div class="mb-4 flex items-center justify-between">\n                <h2 class="text-lg font-semibold text-slate-800">我的申请</h2>\n                <button @click="startPermissionApply(\'\'); showApplyFlow=true"\n                    class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 transition-colors">申请权限</button>\n            </div>\n\n            <div class="mb-4 bg-white border border-slate-200 rounded-lg px-4 py-3">\n                <div class="flex flex-wrap items-center gap-x-6 gap-y-2">\n                    <div class="flex items-center gap-2">\n                        <span class="text-sm text-slate-600 whitespace-nowrap">申请时间：</span>\n                        <input type="date" v-model="applicationFilters.appliedAtStart" class="px-3 py-1.5 border border-slate-200 rounded text-sm bg-white focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200">\n                        <span class="text-sm text-slate-400">~</span>\n                        <input type="date" v-model="applicationFilters.appliedAtEnd" class="px-3 py-1.5 border border-slate-200 rounded text-sm bg-white focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200">\n                    </div>\n                    <div class="flex items-center gap-2">\n                        <span class="text-sm text-slate-600 whitespace-nowrap">表名称：</span>\n                        <input v-model="applicationFilters.tableName" placeholder="模糊搜索表名称" class="px-3 py-1.5 border border-slate-200 rounded text-sm bg-white w-48 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200">\n                    </div>\n                    <div class="flex items-center gap-2">\n                        <span class="text-sm text-slate-600 whitespace-nowrap">授权方式：</span>\n                        <select v-model="applicationFilters.authType" class="px-3 py-1.5 border border-slate-200 rounded text-sm bg-white w-36 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200">\n                            <option value="">全部方式</option><option value="standard">按标准角色授权</option><option value="custom">按表授权</option><option value="copy">复制他人权限</option>\n                        </select>\n                    </div>\n                    <div class="flex items-center gap-2">\n                        <span class="text-sm text-slate-600 whitespace-nowrap">角色名称：</span>\n                        <input v-model="applicationFilters.roleName" placeholder="请输入" class="px-3 py-1.5 border border-slate-200 rounded text-sm bg-white w-48 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200">\n                    </div>\n                    <div class="flex items-center gap-2">\n                        <span class="text-sm text-slate-600 whitespace-nowrap">申请状态：</span>\n                        <select v-model="applicationFilters.status" class="px-3 py-1.5 border border-slate-200 rounded text-sm bg-white w-36 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200">\n                            <option value="">全部状态</option><option value="pending">审批中</option><option value="approved">已通过</option><option value="rejected">已拒绝</option>\n                        </select>\n                    </div>\n                </div>\n            </div>\n\n            <!-- 统一申请列表 -->\n            <div>\n                <div v-if="filteredApplications.length===0" class="py-12 text-center text-slate-400">\n                    <p class="text-sm">暂无申请记录</p>\n                    <button @click="startPermissionApply(\'\'); showApplyFlow=true"\n                        class="mt-2 text-sm text-indigo-600 hover:text-indigo-800">去申请权限</button>\n                </div>\n                <div v-else class="bg-white border border-slate-200 rounded-lg overflow-hidden">\n                    <table class="min-w-full">\n                        <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10"><tr>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 w-[120px]">申请时间</th>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 w-[200px]">授权方式</th>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 w-[300px]">角色名称</th>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">表名称</th>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 w-[140px]">到期时间</th>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 w-[110px]">申请状态</th>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 w-[120px]">操作</th>\n                        </tr></thead>\n                        <tbody class="divide-y divide-slate-100">\n                            <template v-for="app in filteredApplications" :key="app.id">\n                                <tr @click="openDetailDrawer(app, \'my_applications\')" class="hover:bg-indigo-50/50 cursor-pointer transition-colors">\n                                    <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">{{ app.appliedAt }}</td>\n                                    <td class="px-4 py-3">\n                                        <div class="flex items-center gap-1.5 flex-wrap">\n                                            <span class="text-sm text-slate-700">{{ authTypeLabel(app.type) }}</span>\n                                            <!-- 代申请标记 -->\n                                            <span v-if="app.proxyApplicantName"\n                                                class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded text-[10px] font-medium whitespace-nowrap flex-shrink-0">\n                                                <i class="ph ph-users text-[10px]"></i>代申请人：{{ app.proxyApplicantName }}\n                                            </span>\n                                        </div>\n                                    </td>\n                                    <td class="px-4 py-3">\n                                        <div class="flex items-center gap-1.5 flex-wrap">\n                                            <span class="text-sm font-medium text-slate-800 truncate max-w-[180px]"\n                                                :title="app.type === \'custom\' ? \'【非标角色】曲景怡qujingyi\' : (app.roleNames || app.roleName)">\n                                                <span v-if="app.type === \'custom\'">【非标角色】曲景怡qujingyi</span>\n                                                <span v-else>{{ app.roleNames || app.roleName }}</span>\n                                            </span>\n                                            <!-- 多角色标记 -->\n                                            <span v-if="app.roles && app.roles.length > 1"\n                                                class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-indigo-100 text-indigo-700 rounded text-[10px] font-medium whitespace-nowrap flex-shrink-0">\n                                                {{ app.roles.length }} 个角色\n                                            </span>\n                                        </div>\n                                    </td>\n                                    <td class="px-4 py-3">\n                                        <div class="flex flex-wrap gap-1">\n                                            <span v-for="t in app.tables" :key="t.tableId" class="px-1.5 py-0.5 bg-slate-50 text-slate-600 rounded text-xs">{{ t.tableName }}</span>\n                                            <span v-if="!app.tables || app.tables.length === 0" class="text-xs text-slate-400">-</span>\n                                        </div>\n                                    </td>\n                                    <td class="px-4 py-3 whitespace-nowrap">\n                                        <div class="flex flex-col gap-1">\n                                            <span class="text-xs text-slate-600">{{ app.expireAt || \'-\' }}</span>\n                                            <span v-if="app.expireAt && app.status === \'approved\' && (() => { const diff = (new Date(app.expireAt) - new Date()) / 86400000; return diff >= 0 && diff <= 7; })()"\n                                                class="inline-flex items-center gap-0.5 px-1.5 py-0.5 bg-orange-100 border border-orange-300 text-orange-700 rounded text-[10px] font-semibold w-fit">\n                                                <i class="ph ph-warning text-[10px]"></i>即将到期\n                                            </span>\n                                        </div>\n                                    </td>\n                                    <td class="px-4 py-3 whitespace-nowrap">\n                                        <span :class="[\'px-2 py-0.5 rounded text-xs font-medium\', appStatusClass(app.status)]">{{ appStatusLabel(app.status) }}</span>\n                                    </td>\n                                    <td class="px-4 py-3 whitespace-nowrap">\n                                        <div class="flex items-center gap-2">\n                                            <button @click.stop="openDetailDrawer(app, \'my_applications\')" class="text-xs text-indigo-600 hover:text-indigo-800">查看</button>\n                                            <button @click.stop="cancelApplication(app)" v-if="app.status===\'pending\'" class="text-xs text-red-600 hover:text-red-800">撤销</button>\n                                            <button @click.stop="openRenewalForm(app); showApplyFlow=true"\n                                                v-if="app.status === \'approved\' && app.expireAt && (() => { const diff = (new Date(app.expireAt) - new Date()) / 86400000; return diff >= 0 && diff <= 7; })()"\n                                                class="text-xs font-medium text-orange-600 hover:text-orange-800 border border-orange-300 rounded px-1.5 py-0.5 bg-orange-50 hover:bg-orange-100 transition-colors whitespace-nowrap">\n                                                续签\n                                            </button>\n                                        </div>\n                                    </td>\n                                </tr>\n                            </template>\n                        </tbody>\n                    </table>\n                </div>\n            </div>\n        </div>\n    </div>\n\n    <!-- ===== Tab: 我的权限 ===== -->\n    <div v-if="permissionCenterTab === \'my_permissions\'" class="">\n\n        <!-- 标题行 + 申请入口 -->\n        <div class="mb-4 flex items-center justify-between">\n            <div>\n                <h2 class="text-lg font-semibold text-slate-800">我的权限</h2>\n                <p class="text-xs text-slate-400 mt-0.5">当前生效的数据访问权限，按角色或按表聚合展示</p>\n            </div>\n\n        </div>\n\n        <!-- 空状态 -->\n        <div v-if="myActiveRolePerms.length === 0 && myActiveTablePerms.length === 0" class="py-16 text-center text-slate-400 bg-white border border-slate-200 rounded-xl">\n            <i class="ph ph-shield-slash text-4xl mb-3 block text-slate-300"></i>\n            <p class="text-sm font-medium text-slate-500 mb-1">暂无生效中的权限</p>\n            <p class="text-xs text-slate-400">申请通过后将在此处展示您有权访问的数据资源</p>\n        </div>\n\n        <!-- 主体：左导航 + 右详情 -->\n        <div v-else class="bg-white border border-slate-200 rounded-xl overflow-hidden" style="min-height: 540px; display: flex;">\n\n            <!-- 左侧导航列 -->\n            <div style="width: 220px; flex-shrink: 0; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden;">\n\n                <!-- 按角色 / 按表 切换 -->\n                <div style="padding: 10px 10px 8px; border-bottom: 1px solid #e2e8f0;">\n                    <div style="display: flex; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: #f1f5f9;">\n                        <button\n                            @click="switchMyPermView(\'by-role\')"\n                            :style="myPermViewMode === \'by-role\' ? \'flex:1;border:none;padding:6px 0;font-size:12px;cursor:pointer;background:#4f46e5;color:white;font-weight:600;transition:all 0.15s;\' : \'flex:1;border:none;background:none;padding:6px 0;font-size:12px;cursor:pointer;color:#64748b;transition:all 0.15s;\'"\n                        >按角色</button>\n                        <button\n                            @click="switchMyPermView(\'by-table\')"\n                            :style="myPermViewMode === \'by-table\' ? \'flex:1;border:none;padding:6px 0;font-size:12px;cursor:pointer;background:#4f46e5;color:white;font-weight:600;transition:all 0.15s;\' : \'flex:1;border:none;background:none;padding:6px 0;font-size:12px;cursor:pointer;color:#64748b;transition:all 0.15s;\'"\n                        >按表</button>\n                    </div>\n                </div>\n\n                <!-- 搜索框 -->\n                <div style="padding: 8px 10px; border-bottom: 1px solid #e2e8f0;">\n                    <div style="position: relative;">\n                        <i class="ph ph-magnifying-glass" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:12px;"></i>\n                        <input v-model="myPermNavSearch"\n                            :placeholder="myPermViewMode === \'by-role\' ? \'搜索角色…\' : \'搜索表名…\'"\n                            style="width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 8px 6px 26px;font-size:12px;outline:none;box-sizing:border-box;background:white;"\n                        />\n                    </div>\n                </div>\n\n                <!-- 导航列表 -->\n                <div style="flex:1; overflow-y:auto;">\n                    <div v-if="myPermNavItems.length === 0" style="padding:20px 12px;text-align:center;color:#94a3b8;font-size:12px;">无匹配结果</div>\n                    <div\n                        v-for="(item, idx) in myPermNavItems"\n                        :key="item.key"\n                        @click="myPermSelectedIdx = idx"\n                        :style="myPermSelectedIdx === idx\n                            ? \'padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;background:#eff6ff;border-left:3px solid #4f46e5;padding-left:11px;\'\n                            : \'padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:background 0.12s;\'"\n                        class="my-perm-nav-item"\n                    >\n                        <div :style="myPermSelectedIdx === idx ? \'font-size:13px;font-weight:600;color:#4f46e5;line-height:1.3;\' : \'font-size:13px;font-weight:500;color:#1e293b;line-height:1.3;\'">\n                            {{ item.label }}\n                        </div>\n                        <div style="font-size:11px;color:#94a3b8;margin-top:2px;">{{ item.sub }}</div>\n                    </div>\n                </div>\n            </div>\n\n            <!-- 右侧详情区 -->\n            <div style="flex:1; padding:20px 24px; overflow-y:auto; min-width:0;">\n\n                <!-- 无选中 -->\n                <div v-if="!myPermCurrentDetail" style="padding:40px;text-align:center;color:#94a3b8;">\n                    <i class="ph ph-arrow-left text-2xl block mb-2"></i>\n                    <p style="font-size:13px;">请在左侧选择角色或数据表</p>\n                </div>\n\n                <!-- ===== 按角色视图详情 ===== -->\n                <div v-else-if="myPermViewMode === \'by-role\'">\n                    <!-- 角色头部信息卡 -->\n                    <div style="margin-bottom:16px;padding:14px 16px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;">\n                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">\n                            <span style="font-size:15px;font-weight:700;color:#1e293b;">{{ myPermCurrentDetail.roleName }}</span>\n                            <span :class="[\'px-2 py-0.5 rounded-full text-xs font-medium\', sensitivityLevelClass(myPermCurrentDetail.sensitivityLevel)]">\n                                {{ sensitivityLevelLabel(myPermCurrentDetail.sensitivityLevel) }}\n                            </span>\n                        </div>\n                        <div v-if="myPermCurrentDetail.description" style="font-size:12px;color:#3b82f6;line-height:1.6;">{{ myPermCurrentDetail.description }}</div>\n                    </div>\n\n                    <!-- 该角色下涵盖的数据资产，每张表一个卡片，与按表视图保持一致 -->\n                    <div v-for="(tbl, ti) in myPermCurrentDetail.tables" :key="tbl.tableId" style="margin-bottom:14px;padding:16px;border:1px solid rgb(226, 232, 240);border-radius:10px;background:white;">\n\n                        <!-- 表标题行（与按表视图授权标题行同款） -->\n                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgb(241, 245, 249);">\n                            <span style="font-family:monospace;font-size:10px;background:rgb(241, 245, 249);border:1px solid rgb(226, 232, 240);border-radius:4px;padding:2px 6px;color:rgb(148, 163, 184);">资产 {{ti+1}}</span>\n                            <span style="font-size:14px;font-weight:600;color:rgb(26, 32, 44);">{{ tbl.chineseName || tbl.tableName }}</span>\n                            <span style="font-family:monospace;font-size:10px;color:rgb(148, 163, 184);background:rgb(241, 245, 249);border:1px solid rgb(226, 232, 240);border-radius:4px;padding:2px 6px;">{{ tbl.tableName }}</span>\n                            <span style="margin-left:auto;font-family:monospace;font-size:11px;color:rgb(148, 163, 184);">到期：{{ tbl.rules[0]?.app?.expireAt || \'-\' }}</span>\n                        </div>\n\n                        <!-- 行权限 -->\n                        <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;">\n                            <div style="font-size:12px;color:rgb(100, 116, 139);width:60px;flex-shrink:0;padding-top:4px;">行权限</div>\n                            <div style="flex:1;">\n                                <template v-if="tbl.rules[0]?.rowFilters && tbl.rules[0].rowFilters.length > 0">\n                                    <div v-for="f in tbl.rules[0].rowFilters" :key="f.id||f.label" class="mb-1.5 last:mb-0">\n                                        <button\n                                            @click="toggleRowExprDOM($event.currentTarget)"\n                                            class="inline-flex items-center gap-1 px-2.5 py-1 bg-teal-50 border border-teal-200 text-teal-700 rounded-lg text-xs hover:bg-teal-100 hover:border-teal-400 transition-colors cursor-pointer">\n                                            <i class="ph ph-funnel text-[10px]"></i>\n                                            {{ f.label || f }}\n                                            <i class="ph ph-caret-down text-[10px] opacity-60"></i>\n                                        </button>\n                                        <div v-if="f.id && getRowExprContent(f.id)" class="row-expr-block mt-1.5 ml-1" style="display:none">\n                                            <pre class="bg-slate-900 text-emerald-300 rounded-lg px-3 py-2.5 text-[11px] font-mono leading-relaxed overflow-x-auto whitespace-pre-wrap">{{ getRowExprContent(f.id) }}</pre>\n                                        </div>\n                                    </div>\n                                </template>\n                                <div v-else style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:rgb(240, 253, 244);border:1px solid rgb(187, 247, 208);border-radius:6px;font-size:12px;color:rgb(21, 128, 61);">\n                                    无行限制\n                                </div>\n                            </div>\n                        </div>\n\n                        <!-- 字段范围：优先从 columnPermissionRules.tableFields 取，fallback 到 tbl.rules[0].fields -->\n                        <div style="display:flex;align-items:flex-start;gap:12px;">\n                            <div style="font-size:12px;color:rgb(100, 116, 139);width:60px;flex-shrink:0;padding-top:4px;">字段范围</div>\n                            <div style="flex:1;">\n                                <template v-if="columnPermissionRules.find(r => r.id === myPermCurrentDetail.roleId)?.tableFields?.[tbl.tableId]?.length > 0">\n                                    <div v-for="(group, gi) in groupFieldsByCategory(columnPermissionRules.find(r => r.id === myPermCurrentDetail.roleId).tableFields[tbl.tableId], tbl.tableId, 999, 999).groups" :key="gi" style="margin-bottom:8px;">\n                                        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">\n                                            <span style="font-size:11px;font-weight:600;color:rgb(100, 116, 139);background:rgb(241, 245, 249);padding:1px 6px;border-radius:4px;">{{ group.category }}</span>\n                                            <span style="font-size:11px;color:rgb(148, 163, 184);">{{ group.count }} 个</span>\n                                        </div>\n                                        <div style="display:flex;flex-wrap:wrap;gap:4px;">\n                                            <span v-for="f in group.fields" :key="f.name" style="padding:2px 8px;background:rgb(239, 246, 255);color:rgb(55, 48, 163);border:1px solid rgb(199, 210, 254);border-radius:4px;font-size:11px;">{{ f.chineseName }}</span>\n                                        </div>\n                                    </div>\n                                </template>\n                                <template v-else-if="tbl.rules[0]?.fields && tbl.rules[0].fields.length > 0">\n                                    <div style="display:flex;flex-wrap:wrap;gap:4px;">\n                                        <span v-for="f in tbl.rules[0].fields" :key="typeof f===\'string\'?f:f.name"\n                                            style="padding:2px 8px;background:rgb(239, 246, 255);color:rgb(55, 48, 163);border:1px solid rgb(199, 210, 254);border-radius:4px;font-size:11px;">\n                                            {{ hrFieldChineseNameMap[typeof f===\'string\'?f:f.name] || (typeof f===\'string\'?f:(f.chineseName||f.name)) }}\n                                        </span>\n                                    </div>\n                                </template>\n                                <span v-else style="font-size:12px;color:rgb(148, 163, 184);">未指定具体字段（角色默认范围）</span>\n                            </div>\n                        </div>\n\n                    </div>\n\n                </div>\n\n                <!-- ===== 按表视图详情 ===== -->\n                <div v-else-if="myPermViewMode === \'by-table\'">\n                    <!-- 表头部信息卡 -->\n                    <div style="margin-bottom:16px;padding:14px 16px;background:rgb(248, 250, 252);border:1px solid rgb(226, 232, 240);border-radius:10px;">\n                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">\n                            <span style="font-size:15px;font-weight:700;color:rgb(26, 32, 44)">{{ myPermCurrentDetail.chineseName || myPermCurrentDetail.tableName }}</span>\n                            <span style="font-family:monospace;font-size:11px;color:rgb(148, 163, 184);background:rgb(241, 245, 249);border:1px solid rgb(226, 232, 240);border-radius:4px;padding:2px 7px;">{{ myPermCurrentDetail.tableName }}</span>\n                        </div>\n                        <div style="font-size:12px;color:rgb(100, 116, 139)">拥有该表权限的角色：<strong style="color:rgb(79, 70, 229)">{{ myPermCurrentDetail.rules.length }}</strong> 个</div>\n                    </div>\n\n                    <!-- 该表关联的所有角色授权 -->\n                    <div v-for="(roleRule, ri) in myPermCurrentDetail.rules" :key="ri" style="margin-bottom:18px;padding:16px;border:1px solid rgb(226, 232, 240);border-radius:10px;background:white;">\n                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgb(241, 245, 249)">\n                            <span style="font-family:monospace;font-size:10px;background:rgb(241, 245, 249);border:1px solid rgb(226, 232, 240);border-radius:4px;padding:2px 6px;color:rgb(148, 163, 184)">授权 {{ri+1}}</span>\n                            <span style="font-size:14px;font-weight:600;color:rgb(26, 32, 44)">{{ roleRule.roleName }}</span>\n                            <span :class="[\'px-2 py-0.5 rounded-full text-xs font-medium\', sensitivityLevelClass(roleRule.sensitivityLevel)]">\n                                {{ sensitivityLevelLabel(roleRule.sensitivityLevel) }}\n                            </span>\n                            <span style="margin-left:auto;font-family:monospace;font-size:11px;color:rgb(148, 163, 184)">到期：{{ roleRule.app.expireAt }}</span>\n                        </div>\n\n                        <!-- 行权限 -->\n                        <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px">\n                            <div style="font-size:12px;color:rgb(100, 116, 139);width:60px;flex-shrink:0;padding-top:4px">行权限</div>\n                            <div style="flex:1;">\n                                <template v-if="roleRule.rowFilters && roleRule.rowFilters.length > 0">\n                                    <div v-for="f in roleRule.rowFilters" :key="f.id||f.label" class="mb-1.5 last:mb-0">\n                                        <button\n                                            @click="toggleRowExprDOM($event.currentTarget)"\n                                            class="inline-flex items-center gap-1 px-2.5 py-1 bg-teal-50 border border-teal-200 text-teal-700 rounded-lg text-xs hover:bg-teal-100 hover:border-teal-400 transition-colors cursor-pointer">\n                                            <i class="ph ph-funnel text-[10px]"></i>\n                                            {{ f.label || f }}\n                                            <i class="ph ph-caret-down text-[10px] opacity-60"></i>\n                                        </button>\n                                        <div v-if="f.id && getRowExprContent(f.id)" class="row-expr-block mt-1.5 ml-1" style="display:none">\n                                            <pre class="bg-slate-900 text-emerald-300 rounded-lg px-3 py-2.5 text-[11px] font-mono leading-relaxed overflow-x-auto whitespace-pre-wrap">{{ getRowExprContent(f.id) }}</pre>\n                                        </div>\n                                    </div>\n                                </template>\n                                <div v-else style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:rgb(240, 253, 244);border:1px solid rgb(187, 247, 208);border-radius:6px;font-size:12px;color:rgb(21, 128, 61)">\n                                    无行限制\n                                </div>\n                            </div>\n                        </div>\n\n                        <!-- 字段范围 -->\n                        <div style="display:flex;align-items:flex-start;gap:12px">\n                            <div style="font-size:12px;color:rgb(100, 116, 139);width:60px;flex-shrink:0;padding-top:4px">字段范围</div>\n                            <div style="flex:1">\n                                <template v-if="columnPermissionRules.find(r => r.id === roleRule.roleId)?.tableFields?.[myPermCurrentDetail.tableId]?.length > 0">\n                                    <div v-for="(group, gi) in groupFieldsByCategory(columnPermissionRules.find(r => r.id === roleRule.roleId).tableFields[myPermCurrentDetail.tableId], myPermCurrentDetail.tableId, 999, 999).groups" :key="gi" style="margin-bottom:8px;">\n                                        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">\n                                            <span style="font-size:11px;font-weight:600;color:rgb(100, 116, 139);background:rgb(241, 245, 249);padding:1px 6px;border-radius:4px;">{{ group.category }}</span>\n                                            <span style="font-size:11px;color:rgb(148, 163, 184);">{{ group.count }} 个</span>\n                                        </div>\n                                        <div style="display:flex;flex-wrap:wrap;gap:4px;">\n                                            <span v-for="f in group.fields" :key="f.name" style="padding:2px 8px;background:rgb(239, 246, 255);color:rgb(55, 48, 163);border:1px solid rgb(199, 210, 254);border-radius:4px;font-size:11px;">{{ f.chineseName }}</span>\n                                        </div>\n                                    </div>\n                                </template>\n                                <template v-else-if="roleRule.fields && roleRule.fields.length > 0">\n                                    <div style="display:flex;flex-wrap:wrap;gap:4px;">\n                                        <span v-for="f in roleRule.fields" :key="typeof f===\'string\'?f:f.name"\n                                            style="padding:2px 8px;background:rgb(239, 246, 255);color:rgb(55, 48, 163);border:1px solid rgb(199, 210, 254);border-radius:4px;font-size:11px;">\n                                            {{ hrFieldChineseNameMap[typeof f===\'string\'?f:f.name] || (typeof f===\'string\'?f:(f.chineseName||f.name)) }}\n                                        </span>\n                                    </div>\n                                </template>\n                                <span v-else style="font-size:12px;color:rgb(148, 163, 184)">未指定具体字段</span>\n                            </div>\n                        </div>\n                    </div>\n\n                </div>\n\n            </div>\n        </div>\n    </div>\n\n    <!-- ===== Tab: 我的审批 ===== -->\n    <div v-if="permissionCenterTab === \'my_approval\'" class="">\n        <div class="mb-4"><h2 class="text-lg font-semibold text-slate-800">我的审批</h2></div>\n        <div class="mb-4 bg-white border border-slate-200 rounded-lg px-4 py-3">\n            <div class="flex flex-wrap items-center gap-x-6 gap-y-2">\n                <div class="flex items-center gap-2">\n                    <span class="text-sm text-slate-600 whitespace-nowrap">申请人：</span>\n                    <input v-model="approvalFilters.applicant" placeholder="请输入" class="px-3 py-1.5 border border-slate-200 rounded text-sm bg-white w-48 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200">\n                </div>\n                <div class="flex items-center gap-2">\n                    <span class="text-sm text-slate-600 whitespace-nowrap">申请时间：</span>\n                    <input type="date" v-model="approvalFilters.appliedAt" class="px-3 py-1.5 border border-slate-200 rounded text-sm bg-white w-40 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200">\n                </div>\n                <div class="flex items-center gap-2">\n                    <span class="text-sm text-slate-600 whitespace-nowrap">授权方式：</span>\n                    <select v-model="approvalFilters.authType" class="px-3 py-1.5 border border-slate-200 rounded text-sm bg-white w-36 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200">\n                        <option value="">全部方式</option><option value="standard">按标准角色授权</option><option value="custom">按表授权</option><option value="copy">复制他人权限</option>\n                    </select>\n                </div>\n                <div class="flex items-center gap-2">\n                    <span class="text-sm text-slate-600 whitespace-nowrap">审批状态：</span>\n                    <select v-model="approvalFilters.status" class="px-3 py-1.5 border border-slate-200 rounded text-sm bg-white w-36 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200">\n                        <option value="">全部状态</option><option value="pending">待审批</option><option value="approved">已通过</option><option value="rejected">已拒绝</option>\n                    </select>\n                </div>\n            </div>\n        </div>\n        <div v-if="filteredApprovalItems.length === 0" class="py-12 text-center text-slate-400"><p class="text-sm">暂无需要审批的单据</p></div>\n        <div v-else class="bg-white border border-slate-200 rounded-lg overflow-hidden">\n            <table class="min-w-full">\n                <thead class="bg-slate-50 border-b border-slate-200"><tr>\n                    <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">申请人</th>\n                    <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 w-[100px]">申请时间</th>\n                    <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 w-[120px]">授权方式</th>\n                    <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">角色名称</th>\n                    <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">表名称</th>\n                    <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 w-[110px]">审批状态</th>\n                    <th class="px-4 py-3 text-right text-xs font-semibold text-slate-500 w-[100px]">操作</th>\n                </tr></thead>\n                <tbody class="divide-y divide-slate-100">\n                    <tr v-for="item in filteredApprovalItems" :key="item.id" @click="window.open(\'/bpm_approval.html?id=\'+item.id,\'_blank\')" class="hover:bg-indigo-50/50 cursor-pointer transition-colors">\n                        <td class="px-4 py-3"><div class="text-sm font-medium text-slate-800">{{ item.applicantName }}</div><div class="text-xs text-slate-400">{{ item.applicantId }}</div></td>\n                        <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">{{ item.appliedAt }}</td>\n                        <td class="px-4 py-3 text-sm text-slate-700">{{ authTypeLabel(item.type) }}</td>\n                        <td class="px-4 py-3 text-sm text-slate-700">{{ item.type === \'custom\' ? \'-\' : (item.roleNames || item.roleName) }}</td>\n                        <td class="px-4 py-3"><template v-if="item.type === \'custom\' || !(item.roleNames || item.roleName)"><div class="flex flex-wrap gap-1"><span v-for="t in item.tables" :key="t.tableId" class="px-1.5 py-0.5 bg-slate-50 text-slate-600 rounded text-xs">{{ t.tableName }}</span></div></template><span v-else class="text-xs text-slate-400">—</span></td>\n                        <td class="px-4 py-3"><span :class="[\'px-2 py-0.5 rounded text-xs font-medium\', approvalStatusClass(item.myApprovalStatus)]">{{ approvalStatusLabel(item.myApprovalStatus) }}</span></td>\n                        <td class="px-4 py-3 text-right"><div class="flex items-center gap-2 justify-end">\n                            <a :href="\'/bpm_approval.html?id=\'+item.id" target="_blank" @click.stop class="text-xs text-indigo-600 hover:text-indigo-800">查看详情</a>\n                        </div></td>\n                    </tr>\n                </tbody>\n            </table>\n        </div>\n    </div>\n\n    <!-- ===== Tab: 权限审计清查 ===== -->\n    <div v-if="permissionCenterTab === \'audit\'" class="">\n        <div class="mb-6"><h2 class="text-lg font-semibold text-slate-800">权限审计清查</h2><p class="text-sm text-slate-500 mt-1">查询并管理全局权限</p></div>\n        <div class="flex gap-2 mb-6">\n            <button @click="auditSearchMode=\'by_person\'; auditSearchPersonResult=null; auditSearchPersonQuery=\'\'" :class="[\'px-4 py-2 rounded-lg text-sm font-medium border-2\', auditSearchMode===\'by_person\' ? \'border-indigo-500 bg-indigo-50 text-indigo-700\' : \'border-slate-200 text-slate-600\']">按人查</button>\n            <button @click="auditSearchMode=\'by_table\'; auditSearchTableResult=[]; auditSearchTableId=null" :class="[\'px-4 py-2 rounded-lg text-sm font-medium border-2\', auditSearchMode===\'by_table\' ? \'border-indigo-500 bg-indigo-50 text-indigo-700\' : \'border-slate-200 text-slate-600\']">按表查</button>\n        </div>\n\n        <!-- 按人查 -->\n        <div v-if="auditSearchMode===\'by_person\'">\n            <div class="flex gap-3 mb-6">\n                <input v-model="auditSearchPersonQuery" @keyup.enter="auditSearchByPerson()" placeholder="输入员工姓名或工号搜索..." class="flex-1 px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"/>\n                <button @click="auditSearchByPerson()" class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">搜索</button>\n            </div>\n            <div v-if="auditSearchPersonResult !== null">\n                <div v-if="auditSearchPersonResult.length === 0" class="py-12 text-center text-slate-400"><p class="text-sm">未找到相关人员的权限记录</p></div>\n                <div v-else>\n                    <p class="text-sm text-slate-600 mb-4">找到 <span class="font-semibold text-slate-800">{{ auditSearchPersonResult.length }}</span> 条权限记录</p>\n                    <!-- 每条权限记录 -->\n                    <div v-for="app in auditSearchPersonResult" :key="app.id" class="mb-3">\n                        <div class="bg-white border border-slate-200 rounded-lg p-4">\n                            <div class="flex items-center justify-between gap-4">\n                                <div class="flex-1">\n                                    <div class="flex items-center gap-2 mb-1">\n                                        <span class="text-sm font-semibold text-slate-800">{{ app.applicantName }}</span>\n                                        <span class="text-xs text-slate-400">{{ app.applicantId }}</span>\n                                        <span :class="[\'px-2 py-0.5 rounded-full text-[11px] font-medium\', appStatusClass(app.status)]">{{ appStatusLabel(app.status) }}</span>\n                                    </div>\n                                    <div class="text-sm text-slate-700">{{ app.roleName }}</div>\n                                    <div class="flex flex-wrap gap-1.5 mt-1"><span v-for="t in app.tables" :key="t.tableId" class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs">{{ t.tableName }}</span></div>\n                                    <div class="text-xs text-slate-400 mt-1">有效期至 {{ app.expireAt }}</div>\n                                </div>\n                                <div class="flex gap-2">\n                                    <button @click="viewingAppDetail = viewingAppDetail === app.id ? null : app.id" class="text-xs text-indigo-600 hover:text-indigo-800 border border-indigo-200 rounded px-2 py-1 hover:bg-indigo-50">查看</button>\n                                    <button v-if="app.status===\'approved\'" @click="openFreezeConfirm(app,\'freeze\')" class="text-xs text-orange-600 hover:text-orange-800 border border-orange-200 rounded px-2 py-1 hover:bg-orange-50">冻结</button>\n                                    <button v-if="app.status===\'frozen\'" @click="openFreezeConfirm(app,\'unfreeze\')" class="text-xs text-green-600 hover:text-green-800 border border-green-200 rounded px-2 py-1 hover:bg-green-50">解冻</button>\n                                </div>\n                            </div>\n                            <!-- 权限详情展开 -->\n                            <div v-if="viewingAppDetail === app.id" class="mt-3 pt-3 border-t border-slate-200">\n                                <div v-for="t in app.tables" :key="t.tableId" class="mb-2 p-2 bg-slate-50 rounded-lg">\n                                    <div class="text-sm font-medium text-slate-700 mb-1">{{ t.tableName }} <span class="text-xs text-slate-400">{{ t.chineseName }}</span></div>\n                                    <div class="mb-1"><span class="text-xs font-semibold text-slate-500">列权限：</span>\n                                        <span v-if="t.fields && t.fields.length > 0" class="flex flex-wrap gap-0.5"><span v-for="f in t.fields" :key="f" class="inline-flex items-center px-1 py-0.5 rounded bg-blue-900/20 text-blue-700 font-mono text-[11px]">{{ f }}</span></span>\n                                        <span v-else class="text-xs text-green-700 font-medium">全部字段</span>\n                                    </div>\n                                    <div><span class="text-xs font-semibold text-slate-500">行权限：</span>\n                                        <span v-if="t.rowFilters && t.rowFilters.length > 0" class="space-x-1"><span v-for="(filter, fi) in t.rowFilters" :key="fi" class="text-xs"><span class="font-mono text-slate-700">{{ filter.field }}</span> <span class="text-slate-500">{{ filter.operator }}</span> <span class="font-mono text-slate-700">{{ filter.value }}</span></span></span>\n                                        <span v-else class="text-xs text-slate-400">无限制</span>\n                                    </div>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n        </div>\n\n        <!-- 按表查 -->\n        <div v-if="auditSearchMode===\'by_table\'">\n            <div class="flex gap-3 mb-6">\n                <select v-model="auditSearchTableId" class="flex-1 px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 bg-white">\n                    <option :value="null">选择数据表...</option>\n                    <option v-for="tbl in availableTablesForColumnPermission" :key="tbl.id" :value="tbl.id">{{ tbl.name }} · {{ tbl.chineseName }}</option>\n                </select>\n                <button @click="auditSearchByTable()" class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">查询</button>\n            </div>\n            <div v-if="auditSearchTableResult.length > 0">\n                <p class="text-sm text-slate-600 mb-4">该表共 <span class="font-semibold text-slate-800">{{ auditSearchTableResult.length }}</span> 个用户有权限</p>\n                <div v-for="app in auditSearchTableResult" :key="app.id" class="mb-3">\n                    <div class="bg-white border border-slate-200 rounded-lg p-4">\n                        <div class="flex items-center justify-between gap-4">\n                            <div class="flex-1">\n                                <div class="flex items-center gap-2 mb-1"><span class="text-sm font-semibold text-slate-800">{{ app.applicantName }}</span><span class="text-xs text-slate-400">{{ app.applicantId }}</span></div>\n                                <div class="text-sm text-slate-700">{{ app.roleName }}</div>\n                                <div class="text-xs text-slate-400 mt-1">有效期至 {{ app.expireAt }}</div>\n                            </div>\n                            <div class="flex gap-2">\n                                <button @click="viewingAppDetail = viewingAppDetail === app.id ? null : app.id" class="text-xs text-indigo-600 hover:text-indigo-800 border border-indigo-200 rounded px-2 py-1 hover:bg-indigo-50">查看</button>\n                                <button v-if="app.status===\'approved\'" @click="openFreezeConfirm(app,\'freeze\')" class="text-xs text-orange-600 border border-orange-200 rounded px-2 py-1">冻结</button>\n                                <button v-if="app.status===\'frozen\'" @click="openFreezeConfirm(app,\'unfreeze\')" class="text-xs text-green-600 border border-green-200 rounded px-2 py-1">解冻</button>\n                            </div>\n                        </div>\n                        <!-- 权限详情 -->\n                        <div v-if="viewingAppDetail === app.id" class="mt-3 pt-3 border-t border-slate-200">\n                            <div v-for="t in app.tables" :key="t.tableId" class="mb-2 p-2 bg-slate-50 rounded-lg">\n                                <div class="text-sm font-medium text-slate-700 mb-1">{{ t.tableName }} <span class="text-xs text-slate-400">{{ t.chineseName }}</span></div>\n                                <div class="mb-1"><span class="text-xs font-semibold text-slate-500">列权限：</span>\n                                    <span v-if="t.fields && t.fields.length > 0" class="flex flex-wrap gap-0.5"><span v-for="f in t.fields" :key="f" class="inline-flex items-center px-1 py-0.5 rounded bg-blue-900/20 text-blue-700 font-mono text-[11px]">{{ f }}</span></span>\n                                    <span v-else class="text-xs text-green-700 font-medium">全部字段</span>\n                                </div>\n                                <div><span class="text-xs font-semibold text-slate-500">行权限：</span>\n                                    <span v-if="t.rowFilters && t.rowFilters.length > 0"><span v-for="(filter, fi) in t.rowFilters" :key="fi" class="text-xs"><span class="font-mono text-slate-700">{{ filter.field }}</span> <span class="text-slate-500">{{ filter.operator }}</span> <span class="font-mono text-slate-700">{{ filter.value }}</span></span></span>\n                                    <span v-else class="text-xs text-slate-400">无限制</span>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n            <div v-else-if="auditSearchTableId !== null" class="py-12 text-center text-slate-400"><p class="text-sm">该表暂无权限记录</p></div>\n        </div>\n    </div>\n\n    <!-- ===== 续签弹窗（已替换为表单流程，保留空节点以防引用） ===== -->\n    <!-- 续签现在通过 showApplyFlow + applyMode=\'renewal\' 实现 -->\n\n    <!-- ===== 归还确认弹窗 ===== -->\n    <div v-if="showRevokeConfirm" class="fixed inset-0 bg-black/30 z-50 flex items-center justify-center" @click.self="showRevokeConfirm=false">\n        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">\n            <div class="px-5 py-4 border-b border-slate-200"><h3 class="text-base font-semibold text-slate-900">确认归还权限</h3></div>\n            <div class="p-5">\n                <div class="mb-5"><p class="text-sm text-slate-700 font-medium mb-1">归还后权限立即失效</p><p class="text-sm text-slate-500">如需恢复须重新申请</p><p v-if="revokeTarget" class="text-sm text-slate-700 font-medium mt-2">「{{ revokeTarget.roleName }}」</p></div>\n                <div class="flex gap-3">\n                    <button @click="showRevokeConfirm=false" class="flex-1 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-50">取消</button>\n                    <button @click="confirmRevoke()" class="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm hover:bg-red-600">确认归还</button>\n                </div>\n            </div>\n        </div>\n    </div>\n\n    <!-- ===== 冻结/解冻确认弹窗 ===== -->\n    <div v-if="showFreezeConfirm" class="fixed inset-0 bg-black/30 z-50 flex items-center justify-center" @click.self="showFreezeConfirm=false">\n        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">\n            <div class="px-5 py-4 border-b border-slate-200"><h3 class="text-base font-semibold text-slate-900">{{ freezeAction===\'freeze\' ? \'确认冻结权限\' : \'确认解冻权限\' }}</h3></div>\n            <div class="p-5">\n                <div class="mb-5"><p class="text-sm text-slate-700 font-medium mb-1">{{ freezeAction===\'freeze\' ? \'冻结后权限立即失效\' : \'解冻后权限立即恢复\' }}</p><p v-if="freezeTarget" class="text-sm text-slate-700 font-medium mt-2">「{{ freezeTarget.applicantName }}」的「{{ freezeTarget.roleName }}」</p></div>\n                <div class="flex gap-3">\n                    <button @click="showFreezeConfirm=false" class="flex-1 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-50">取消</button>\n                    <button @click="confirmFreezeAction()" :class="[\'flex-1 py-2 text-white rounded-lg text-sm\', freezeAction===\'freeze\' ? \'bg-orange-500 hover:bg-orange-600\' : \'bg-green-500 hover:bg-green-600\']">{{ freezeAction===\'freeze\' ? \'确认冻结\' : \'确认解冻\' }}</button>\n                </div>\n            </div>\n        </div>\n    </div>\n\n    <!-- ===== Tab: 管理员设置 ===== -->\n    <div v-if="permissionCenterTab === \'admin_settings\'" class="">\n        <div class="mb-6">\n            <h2 class="text-lg font-semibold text-slate-800">管理员设置</h2>\n            <p class="text-sm text-slate-500 mt-1">配置权限审计清查的管理员，仅超级管理员可操作</p>\n        </div>\n\n        <!-- 当前管理员列表 -->\n        <div class="mb-6">\n            <div class="flex items-center justify-between mb-3">\n                <div class="text-sm font-medium text-slate-700">权限管理员列表</div>\n                <button @click="showAddAdminModal = true"\n                    class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 transition-colors">添加管理员</button>\n            </div>\n            <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">\n                <table class="min-w-full">\n                    <thead class="bg-slate-50 border-b border-slate-200">\n                        <tr>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">姓名</th>\n\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">部门</th>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">负责域</th>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">添加时间</th>\n                            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 w-[100px] whitespace-nowrap">状态</th>\n                            <th class="px-4 py-3 text-right text-xs font-semibold text-slate-500 w-[100px]">操作</th>\n                        </tr>\n                    </thead>\n                    <tbody class="divide-y divide-slate-100">\n                        <tr v-for="admin in permissionAdmins" :key="admin.id" class="hover:bg-slate-50/50 transition-colors">\n                            <td class="px-4 py-3 text-sm font-medium text-slate-800">{{ admin.name }}</td>\n\n                            <td class="px-4 py-3 text-sm text-slate-600">{{ admin.department }}</td>\n                            <td class="px-4 py-3">\n                                <div class="flex flex-wrap gap-1">\n                                    <span v-for="d in admin.domains" :key="d" class="px-1.5 py-0.5 bg-indigo-50 text-indigo-600 rounded text-xs">{{ d }}</span>\n                                </div>\n                            </td>\n                            <td class="px-4 py-3 text-xs text-slate-500">{{ admin.addedAt }}</td>\n                            <td class="px-4 py-3 whitespace-nowrap">\n                                <span :class="[\'px-2 py-0.5 rounded text-xs font-medium\', admin.active ? \'bg-green-100 text-green-700\' : \'bg-gray-100 text-gray-400\']">\n                                    {{ admin.active ? \'生效中\' : \'已停用\' }}\n                                </span>\n                            </td>\n                            <td class="px-4 py-3 text-right">\n                                <div class="flex items-center gap-2 justify-end">\n                                    <button v-if="admin.active" @click="admin.active = false" class="text-xs text-orange-600 hover:text-orange-800">停用</button>\n                                    <button v-else @click="admin.active = true" class="text-xs text-green-600 hover:text-green-800">启用</button>\n                                    <button @click="permissionAdmins.splice(permissionAdmins.indexOf(admin), 1)" class="text-xs text-red-600 hover:text-red-800">移除</button>\n                                </div>\n                            </td>\n                        </tr>\n                    </tbody>\n                </table>\n            </div>\n        </div>\n\n        <!-- 说明 -->\n        <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">\n            <div class="flex items-start gap-3">\n                <i class="ph ph-info text-indigo-500 text-lg mt-0.5"></i>\n                <div>\n                    <p class="text-sm text-slate-700 font-medium mb-1">关于权限管理员</p>\n                    <p class="text-xs text-slate-500">权限管理员可以进行「权限审计清查」，查看所有用户的权限使用情况，并执行冻结/解冻操作。每个业务域可以指定多个管理员。管理员变更将记录在审计日志中。</p>\n                </div>\n            </div>\n        </div>\n    </div>\n\n    <!-- ===== 添加管理员弹窗 ===== -->\n    <div v-if="showAddAdminModal" class="fixed inset-0 bg-black/30 z-50 flex items-center justify-center" @click.self="showAddAdminModal=false">\n        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">\n            <div class="px-5 py-4 border-b border-slate-200">\n                <h3 class="text-base font-semibold text-slate-900">添加权限管理员</h3>\n            </div>\n            <div class="p-5">\n                <div class="mb-4">\n                    <label class="text-sm font-medium text-slate-700 mb-1.5 block">姓名 / 工号</label>\n                    <input v-model="newAdminSearchQuery" @input="searchNewAdmin" placeholder="输入姓名或工号搜索" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">\n                    <!-- 搜索结果 -->\n                    <div v-if="newAdminSearchResults.length > 0" class="mt-2 border border-slate-200 rounded-lg overflow-hidden max-h-[120px] overflow-y-auto">\n                        <button v-for="u in newAdminSearchResults" :key="u.id" @click="selectNewAdmin(u)"\n                            :class="[\'w-full px-3 py-2 text-left text-sm hover:bg-indigo-50 transition-colors flex items-center gap-2\', newAdminSelected && newAdminSelected.id === u.id ? \'bg-indigo-50 text-indigo-700\' : \'text-slate-700\']">\n                            <span class="font-medium">{{ u.name }}</span>\n                            <span class="text-xs text-slate-500 font-mono">{{ u.userName }}</span>\n                            <span class="text-xs text-slate-400">{{ u.department }}</span>\n                        </button>\n                    </div>\n                </div>\n                <div v-if="newAdminSelected" class="mb-4 p-3 bg-indigo-50 rounded-lg border border-indigo-200">\n                    <div class="text-sm font-medium text-indigo-700">{{ newAdminSelected.name }} <span class="font-mono text-xs text-indigo-500">{{ newAdminSelected.userName }}</span></div>\n                    <div class="text-xs text-indigo-400 mt-0.5">{{ newAdminSelected.department }}</div>\n                </div>\n                <div class="mb-4">\n                    <label class="text-sm font-medium text-slate-700 mb-1.5 block">负责域</label>\n                    <div class="flex flex-wrap gap-2">\n                        <button v-for="domain in permissionDomains" :key="domain.id"\n                            @click="newAdminDomains.includes(domain.name) ? newAdminDomains.splice(newAdminDomains.indexOf(domain.name), 1) : newAdminDomains.push(domain.name)"\n                            :class="[\'px-3 py-1.5 rounded-lg text-sm border transition-colors\', newAdminDomains.includes(domain.name) ? \'border-indigo-500 bg-indigo-50 text-indigo-700\' : \'border-slate-200 text-slate-600 hover:border-indigo-300\']">\n                            {{ domain.name }}\n                        </button>\n                    </div>\n                </div>\n                <div class="flex gap-3">\n                    <button @click="showAddAdminModal=false; newAdminSelected=null; newAdminSearchQuery=\'\'; newAdminSearchResults=[]; newAdminDomains=[]"\n                        class="flex-1 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-50">取消</button>\n                    <button @click="addPermissionAdmin()"\n                        :disabled="!newAdminSelected || newAdminDomains.length === 0"\n                        :class="[\'flex-1 py-2 rounded-lg text-sm font-medium\', newAdminSelected && newAdminDomains.length > 0 ? \'bg-indigo-600 text-white hover:bg-indigo-700\' : \'bg-slate-200 text-slate-400 cursor-not-allowed\']">\n                        确认添加\n                    </button>\n                </div>\n            </div>\n        </div>\n    </div>\n\n    <!-- ===== 申请详情抽屉 ===== -->\n    <!-- 遮罩层 -->\n    <div v-if="showDetailDrawer" @click="closeDetailDrawer" class="fixed inset-0 bg-black/30 z-[100] transition-opacity"></div>\n    <!-- 抽屉面板 -->\n    <div :class="[\'fixed top-0 right-0 h-full bg-white shadow-2xl z-[101] transition-transform duration-300 ease-in-out overflow-y-auto\', showDetailDrawer ? \'translate-x-0\' : \'translate-x-full\']" style="width: 560px;">\n        <!-- 抽屉头部 -->\n        <div class="sticky top-0 bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between z-10">\n            <div class="flex items-center gap-3">\n                <h3 class="text-base font-semibold text-slate-800">{{ detailDrawerSourceTab === \'my_approval\' ? \'审批详情\' : \'申请详情\' }}</h3>\n                <span v-if="detailDrawerData && detailDrawerSourceTab !== \'my_approval\'" :class="[\'px-2 py-0.5 rounded text-xs font-medium\', appStatusClass(detailDrawerData.status)]">{{ appStatusLabel(detailDrawerData.status) }}</span>\n                <span v-if="detailDrawerData && detailDrawerSourceTab === \'my_approval\'" :class="[\'px-2 py-0.5 rounded text-xs font-medium\', approvalStatusClass(detailDrawerData.myApprovalStatus)]">{{ approvalStatusLabel(detailDrawerData.myApprovalStatus) }}</span>\n            </div>\n            <button @click="closeDetailDrawer" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors">\n                <i class="ph ph-x text-lg"></i>\n            </button>\n        </div>\n\n        <!-- 抽屉内容 -->\n        <div v-if="detailDrawerData" class="px-6 py-5">\n\n            <!-- ── 我的申请专属布局 ── -->\n            <template v-if="detailDrawerSourceTab === \'my_applications\'">\n\n                <!-- 申请人 & 申请时间 -->\n                <div class="mb-6">\n                    <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">基本信息</h4>\n                    <div class="grid grid-cols-2 gap-y-3 gap-x-6">\n                        <div>\n                            <div class="text-xs text-slate-400 mb-0.5">申请人</div>\n                            <div class="text-sm font-medium text-slate-800">{{ detailDrawerData.applicantName }}</div>\n                        </div>\n                        <div>\n                            <div class="text-xs text-slate-400 mb-0.5">申请时间</div>\n                            <div class="text-sm text-slate-800">{{ detailDrawerData.appliedAt }}</div>\n                        </div>\n                        <!-- 代申请人：有代申请时独立展示一行 -->\n                        <div v-if="detailDrawerData.proxyApplicantName" class="col-span-2">\n                            <div class="text-xs text-slate-400 mb-0.5">代申请人</div>\n                            <div class="flex items-center gap-2">\n                                <div class="w-5 h-5 rounded-full bg-amber-100 flex items-center justify-center text-amber-700 text-[10px] font-bold flex-shrink-0">{{ detailDrawerData.proxyApplicantName.slice(0,1) }}</div>\n                                <span class="text-sm font-medium text-slate-800">{{ detailDrawerData.proxyApplicantName }}</span>\n                                <span class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded text-[10px] font-medium">\n                                    <i class="ph ph-users text-[10px]"></i>代为提交申请\n                                </span>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n\n                <!-- 授权方式 -->\n                <div class="mb-6">\n                    <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">授权方式</h4>\n                    <div class="flex items-center gap-2">\n                        <span :class="[\'px-2.5 py-1 rounded-lg text-sm font-medium\',\n                            detailDrawerData.type === \'standard\' ? \'bg-indigo-50 text-indigo-700 border border-indigo-200\' :\n                            detailDrawerData.type === \'custom\' ? \'bg-amber-50 text-amber-700 border border-amber-200\' :\n                            \'bg-violet-50 text-violet-700 border border-violet-200\']">\n                            {{ authTypeLabel(detailDrawerData.type) }}\n                        </span>\n                    </div>\n                </div>\n\n                <!-- 具体申请信息 -->\n                <div class="mb-6">\n                    <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">申请信息</h4>\n\n                    <!-- 按标准角色授权：多角色卡片展示 -->\n                    <template v-if="detailDrawerData.type === \'standard\'">\n                        <!-- 角色名称汇总行 -->\n                        <div class="mb-4 pb-4 border-b border-slate-100">\n                            <div class="text-xs text-slate-400 mb-1.5">角色名称</div>\n                            <div class="flex items-start gap-2">\n                                <div class="flex-1 min-w-0">\
