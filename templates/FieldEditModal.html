<div v-if="visible && editingForm" class="fixed inset-0 bg-black/30 z-50 flex items-center justify-center"
    @click.self="$emit('close')">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-xl mx-4 max-h-[90vh] flex flex-col">
        <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between flex-shrink-0">
            <h3 class="text-base font-semibold text-slate-900">编辑字段 · {{ schemaFields[editingFieldIndex]?.name }}</h3>
            <button @click="$emit('close')" class="p-1 text-slate-400 hover:text-slate-600"><i
                    class="ph ph-x text-lg"></i></button>
        </div>
        <div class="p-5 overflow-y-auto flex-1 space-y-4" @click.self="$emit('update:showTagTreeDropdown', false)">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">字段名</label>
                <input :value="schemaFields[editingFieldIndex]?.name" readonly
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 text-slate-500" />
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">类型</label>
                <input :value="schemaFields[editingFieldIndex]?.type" readonly
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 text-slate-500" />
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">描述</label>
                <input v-model="editingForm.description"
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    placeholder="字段说明" />
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">统计信息</label>
                <textarea :value="schemaFields[editingFieldIndex]?.fieldStatistics || '—'" readonly
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 text-slate-500 font-mono whitespace-pre-wrap min-h-[100px]"
                    rows="4"></textarea>
                <p class="mt-1 text-xs text-slate-400">统计信息为自动生成，无法编辑</p>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-2">治理标签</label>
                <div class="relative" @click.stop>
                    <button @click.stop="$emit('update:showTagTreeDropdown', !showTagTreeDropdown)"
                        class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm text-left bg-white hover:border-indigo-300 focus:ring-2 focus:ring-indigo-500 focus:border-transparent flex items-center justify-between group">
                        <span class="text-slate-700">{{ editingForm.governed_tag ?
                            getTagShortName(editingForm.governed_tag) : '— 无 —' }}</span>
                        <i
                            :class="['ph ph-caret-down text-xs text-slate-400 transition-transform', showTagTreeDropdown ? 'rotate-180' : '']"></i>
                        <div v-if="editingForm.governed_tag"
                            class="absolute left-0 top-full mt-1 z-[100] hidden group-hover:block min-w-max p-2 bg-slate-800 text-slate-100 rounded-lg shadow-xl text-xs pointer-events-none">
                            <p class="font-mono">{{ editingForm.governed_tag }}</p>
                        </div>
                    </button>
                    <div v-if="showTagTreeDropdown" @click.stop
                        class="absolute left-0 right-0 top-full mt-1 z-50 max-h-80 bg-white border border-slate-200 rounded-lg shadow-xl overflow-hidden flex flex-col">
                        <div class="p-2 flex-1 overflow-y-auto space-y-0.5">
                            <div @click.stop="$emit('selectTagFromTree', null)"
                                :class="['px-2 py-1.5 text-sm rounded cursor-pointer hover:bg-indigo-50 flex items-center gap-2', !editingForm.governed_tag ? 'bg-indigo-100 text-indigo-700' : 'text-slate-700']">
                                <i class="ph ph-check text-xs" v-if="!editingForm.governed_tag"></i>
                                <span class="w-4" v-else></span>
                                <span>— 无 —</span>
                            </div>
                            <template v-for="node in governedTagTree" :key="node.name">
                                <div :style="{ paddingLeft: '8px' }"
                                    @click.stop="(node.children && node.children.length > 0) ? $emit('toggleTagTreeNode', node.fullPath) : $emit('selectTagFromTree', node.fullPath)"
                                    :class="['px-2 py-1.5 text-sm rounded cursor-pointer flex items-center gap-2', editingForm.governed_tag === node.fullPath ? 'bg-indigo-100 text-indigo-700' : 'hover:bg-indigo-50 text-slate-700']">
                                    <i v-if="node.children && node.children.length > 0"
                                        :class="['ph ph-caret-right text-xs transition-transform flex-shrink-0', tagTreeExpanded[node.fullPath] ? 'rotate-90' : '']"></i>
                                    <span v-else class="w-3"></span>
                                    <i class="ph ph-check text-xs flex-shrink-0"
                                        v-if="editingForm.governed_tag === node.fullPath && (!node.children || !node.children.length)"></i>
                                    <span v-else-if="!node.children || !node.children.length" class="w-3"></span>
                                    <span class="flex-1">{{ node.name }}</span>
                                    <i v-if="node.linkedDict" class="ph ph-link text-xs text-cyan-500 flex-shrink-0"
                                        :title="'关联字典: ' + node.linkedDict"></i>
                                </div>
                                <template
                                    v-if="node.children && node.children.length > 0 && tagTreeExpanded[node.fullPath]">
                                    <div v-for="child in node.children" :key="child.fullPath"
                                        :style="{ paddingLeft: '32px' }"
                                        @click.stop="$emit('selectTagFromTree', child.fullPath)"
                                        :class="['px-2 py-1.5 text-sm rounded cursor-pointer flex items-center gap-2', editingForm.governed_tag === child.fullPath ? 'bg-indigo-100 text-indigo-700' : 'hover:bg-indigo-50 text-slate-700']">
                                        <i class="ph ph-check text-xs flex-shrink-0"
                                            v-if="editingForm.governed_tag === child.fullPath"></i>
                                        <span v-else class="w-3"></span>
                                        <span class="flex-1">{{ child.name }}</span>
                                        <i v-if="child.linkedDict"
                                            class="ph ph-link text-xs text-cyan-500 flex-shrink-0"
                                            :title="'关联字典: ' + child.linkedDict"></i>
                                    </div>
                                </template>
                            </template>
                        </div>
                    </div>
                </div>
                <div v-if="editingForm.governed_tag && hasLinkedDict(editingForm.governed_tag)"
                    class="mt-2 flex items-center gap-1.5 text-xs text-slate-600">
                    <i class="ph ph-link text-xs text-cyan-600"></i>
                    <span>关联字典：</span>
                    <button @click="$emit('navigateToDict', getLinkedDict(editingForm.governed_tag))"
                        class="text-cyan-600 hover:text-cyan-700 underline font-medium">
                        {{ getLinkedDict(editingForm.governed_tag) }}
                    </button>
                </div>
            </div>
            <div>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" v-model="editingForm.is_encrypted"
                        class="rounded border-slate-300 text-rose-600 focus:ring-rose-500" />
                    <span class="text-sm font-medium text-slate-700">加密存储</span>
                </label>
            </div>
            <div>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" v-model="editingForm.is_partition"
                        class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
                    <span class="text-sm font-medium text-slate-700">分区字段</span>
                </label>
                <div v-if="editingForm.is_partition"
                    class="mt-3 ml-6 space-y-3 p-3 bg-violet-50/50 border border-violet-100 rounded-lg">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">分区数据格式</label>
                        <input v-model="editingForm.partition_format"
                            class="w-full px-3 py-1.5 border border-slate-200 rounded text-sm"
                            placeholder="如 yyyyMMdd" />
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">全量 / 增量</label>
                        <select v-model="editingForm.partition_mode"
                            class="w-full px-3 py-1.5 border border-slate-200 rounded text-sm">
                            <option value="full">全量镜像</option>
                            <option value="incremental">增量</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-5 py-4 border-t border-slate-200 flex justify-end gap-2 flex-shrink-0">
            <button @click="$emit('close')"
                class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm">取消</button>
            <button @click="$emit('save')"
                class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">保存</button>
        </div>
    </div>
</div>
