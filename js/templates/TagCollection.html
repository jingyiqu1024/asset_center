            <div class="h-full flex bg-white">
                <!-- 左侧：标签树列表 -->
                <div class="w-1/2 border-r border-slate-200 flex flex-col">
                    <!-- Header -->
                    <div class="px-5 py-4 border-b border-slate-200 bg-slate-50 flex-shrink-0">
                        <div class="flex items-center gap-3">
                            <i class="ph ph-tags text-2xl text-amber-600"></i>
                            <div>
                                <h2 class="text-lg font-semibold text-slate-900">治理标签</h2>
                                <p class="text-sm text-slate-500">标签体系树状视图</p>
                            </div>
                        </div>
                    </div>

                    <!-- 树状列表 -->
                    <div class="flex-1 overflow-y-auto p-4">
                        <div class="space-y-1">
                            <template v-for="tag in tagTree" :key="tag.id">
                                <!-- 一级标签 -->
                                <div 
                                    @click="toggleTag(tag.id)"
                                    class="px-3 py-2 rounded-lg hover:bg-slate-100 cursor-pointer transition-colors flex items-center gap-2">
                                    <i :class="['ph text-sm transition-transform', tag.isOpen ? 'ph-caret-down' : 'ph-caret-right']"></i>
                                    <i class="ph ph-folder text-amber-600"></i>
                                    <span class="text-sm font-medium text-slate-900">{{ tag.name }}</span>
                                    <span class="text-xs text-slate-400 ml-auto">{{ tag.children?.length || 0 }}</span>
                                </div>
                                
                                <!-- 二级标签 -->
                                <template v-if="tag.isOpen">
                                    <div 
                                        v-for="child in tag.children" 
                                        :key="child.id"
                                        @click="selectTag(child)"
                                        :class="[
                                            'pl-8 pr-3 py-2 rounded-lg cursor-pointer transition-colors flex items-center gap-2',
                                            selectedTag?.id === child.id ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-slate-50'
                                        ]">
                                        <i class="ph ph-tag text-amber-500"></i>
                                        <span class="text-sm flex-1">{{ child.name }}</span>
                                        <div class="flex items-center gap-2 text-xs text-slate-400">
                                            <span v-if="child.appliedFieldCount">{{ child.appliedFieldCount }}</span>
                                            <span v-if="child.ruleCount">{{ child.ruleCount }}</span>
                                        </div>
                                    </div>
                                </template>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- 右侧：标签详情 -->
                <div class="flex-1 flex flex-col">
                    <!-- 空状态 -->
                    <div v-if="!selectedTag" class="flex-1 flex items-center justify-center text-slate-400">
                        <div class="text-center">
                            <i class="ph ph-tag text-6xl mb-4"></i>
                            <p class="text-sm">选择左侧标签查看详情</p>
                        </div>
                    </div>

                    <!-- 标签详情 -->
                    <template v-else>
                        <!-- Header -->
                        <div class="px-5 py-4 border-b border-slate-200 bg-slate-50 flex-shrink-0">
                            <div class="flex items-center gap-3">
                                <i class="ph ph-tag text-xl text-amber-600"></i>
                                <div class="flex-1">
                                    <h3 class="text-base font-semibold text-slate-900">{{ selectedTag.name }}</h3>
                                    <p class="text-xs text-slate-500 font-mono">{{ selectedTag.fullPath }}</p>
                                </div>
                            </div>
                        </div>

                        <!-- 详情内容 -->
                        <div class="flex-1 overflow-y-auto p-5 space-y-5">
                            <!-- 标签描述 -->
                            <div>
                                <h4 class="text-sm font-semibold text-slate-700 mb-2">描述</h4>
                                <p class="text-sm text-slate-600">{{ selectedTag.description }}</p>
                            </div>

                            <!-- 应用的字段 -->
                            <div>
                                <h4 class="text-sm font-semibold text-slate-700 mb-3">应用的字段 ({{ selectedTag.appliedFields.length }})</h4>
                                <div class="space-y-2">
                                    <div v-for="field in selectedTag.appliedFields" :key="field.id" 
                                        class="p-3 bg-slate-50 border border-slate-200 rounded-lg hover:border-slate-300 transition-colors">
                                        <div class="flex items-start gap-3">
                                            <i class="ph ph-table text-blue-600 mt-0.5"></i>
                                            <div class="flex-1 min-w-0">
                                                <div class="text-sm font-medium text-slate-900">{{ field.assetName }}</div>
                                                <div class="flex items-center gap-2 mt-1">
                                                    <code class="text-xs font-mono text-slate-700 bg-white px-1.5 py-0.5 rounded border border-slate-200">{{ field.fieldName }}</code>
                                                    <span class="text-xs text-slate-400">{{ field.fieldType }}</span>
                                                </div>
                                                <p v-if="field.description" class="text-xs text-slate-500 mt-1">{{ field.description }}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 关联的权限规则 -->
                            <div>
                                <h4 class="text-sm font-semibold text-slate-700 mb-3">关联的权限规则 ({{ selectedTag.relatedRules.length }})</h4>
                                <div class="space-y-2">
                                    <div v-for="rule in selectedTag.relatedRules" :key="rule.id" 
                                        class="p-3 bg-slate-50 border border-slate-200 rounded-lg hover:border-slate-300 transition-colors">
                                        <div class="flex items-start justify-between mb-2">
                                            <h5 class="text-sm font-medium text-slate-900">{{ rule.name }}</h5>
                                            <span :class="['px-2 py-0.5 rounded text-xs font-medium', rule.enabled ? 'bg-green-100 text-green-700' : 'bg-slate-200 text-slate-600']">
                                                {{ rule.enabled ? '启用' : '禁用' }}
                                            </span>
                                        </div>
                                        <p class="text-xs text-slate-500 mb-2">{{ rule.targetAsset }}</p>
                                        <div class="bg-white border border-slate-200 rounded p-2">
                                            <code class="text-xs text-slate-700">{{ rule.condition }}</code>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
