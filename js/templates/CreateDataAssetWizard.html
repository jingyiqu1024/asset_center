<div v-if="visible" class="fixed inset-0 bg-black/30 z-50 flex items-center justify-center" @click.self="handleClose"
    style="z-index: 9999;">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl mx-4 max-h-[90vh] flex flex-col">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between flex-shrink-0">
            <h3 class="text-lg font-semibold text-slate-900">创建结构化数据资产</h3>
            <button @click="handleClose" class="p-1 text-slate-400 hover:text-slate-600">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-6">
            <!-- Step 1: 选择创建方式 -->
            <div v-if="step === 1" class="space-y-6">
                <p class="text-sm text-slate-500">请选择创建方式：</p>
                <div class="grid grid-cols-3 gap-4">
                    <button @click="handleSelectMethod('VIEW')"
                        class="p-6 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50/50 transition-all text-left group">
                        <div
                            class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mb-4 group-hover:bg-blue-200 transition-colors">
                            <i class="ph ph-eye text-2xl text-blue-600"></i>
                        </div>
                        <h4 class="font-semibold text-slate-900 mb-2">从已有数据资产构建新视图</h4>
                        <p class="text-sm text-slate-500">通过 SQL 视图创建新的数据资产</p>
                    </button>
                    <button @click="handleSelectMethod('ONLINE')"
                        class="p-6 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50/50 transition-all text-left group">
                        <div
                            class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center mb-4 group-hover:bg-green-200 transition-colors">
                            <i class="ph ph-cloud-arrow-down text-2xl text-green-600"></i>
                        </div>
                        <h4 class="font-semibold text-slate-900 mb-2">从生产环境接入新的数据资源</h4>
                        <p class="text-sm text-slate-500">从天工、DataHub、MySQL 等接入</p>
                    </button>
                    <button @click="handleSelectMethod('EXCEL')"
                        class="p-6 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50/50 transition-all text-left group">
                        <div
                            class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center mb-4 group-hover:bg-purple-200 transition-colors">
                            <i class="ph ph-file-xls text-2xl text-purple-600"></i>
                        </div>
                        <h4 class="font-semibold text-slate-900 mb-2">通过本地文件上传</h4>
                        <p class="text-sm text-slate-500">上传 Excel/CSV 文件创建数据资产</p>
                    </button>
                </div>
            </div>

            <!-- Step 2: 填写表单 -->
            <div v-if="step === 2" class="space-y-6">
                <!-- 方式1: 从已有数据资产构建新视图 -->
                <template v-if="method === 'VIEW'">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">表名</label>
                            <input :value="form.name"
                                @input="$emit('update:form', {...form, name: $event.target.value})"
                                class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                placeholder="例如：emp_leave_view" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">查询 SQL</label>
                            <textarea :value="form.viewSql"
                                @input="$emit('update:form', {...form, viewSql: $event.target.value})"
                                class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
                                rows="10"
                                placeholder="SELECT id, name, department, status, joined_at, dt&#10;FROM raw.emp_leave&#10;WHERE dt >= '20230101';"></textarea>
                            <div class="mt-2 flex items-center justify-between">
                                <p class="text-xs text-slate-500">只需编写 SELECT 查询语句</p>
                                <button @click="handlePreview" type="button"
                                    class="px-3 py-1.5 bg-slate-100 text-slate-700 text-xs font-medium rounded-lg hover:bg-slate-200 transition-colors flex items-center gap-1.5">
                                    <i class="ph ph-play"></i>查询
                                </button>
                            </div>
                        </div>

                        <!-- 预览结果区域 -->
                        <div v-if="previewData" class="border border-slate-200 rounded-lg overflow-hidden">
                            <div
                                class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                                <span class="text-sm font-medium text-slate-700">预览结果</span>
                                <span class="text-xs text-slate-500">前 5 行</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-slate-200">
                                    <thead class="bg-slate-50">
                                        <tr>
                                            <th v-for="col in previewData.columns" :key="col"
                                                class="px-4 py-2.5 text-left text-xs font-semibold text-slate-500 uppercase">
                                                {{ col }}
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200 bg-white">
                                        <tr v-for="(row, idx) in previewData.rows" :key="idx" class="hover:bg-slate-50">
                                            <td v-for="(cell, cellIdx) in row" :key="cellIdx"
                                                class="px-4 py-3 text-sm text-slate-700">
                                                {{ cell }}
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">放置目录</label>
                            <div class="relative">
                                <button @click="showCatalogDropdown = !showCatalogDropdown" type="button"
                                    class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm bg-white text-slate-700 hover:border-indigo-300 transition-colors flex items-center justify-between">
                                    <span>{{ form.targetCatalog?.name || '请选择目录' }}</span>
                                    <i class="ph ph-caret-down text-slate-400"></i>
                                </button>
                                <div v-if="showCatalogDropdown"
                                    class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto">
                                    <div class="p-2">
                                        <!-- 新建目录按钮 -->
                                        <button @click.stop="handleCreateNewCatalog" type="button"
                                            class="w-full px-2 py-1.5 mb-1 text-xs font-medium text-indigo-600 hover:bg-indigo-50 rounded flex items-center justify-center gap-1.5 transition-colors">
                                            <i class="ph ph-plus text-sm"></i>新建目录
                                        </button>
                                        <div class="border-t border-slate-200 my-1"></div>
                                        <!-- 简化版目录树，实际应该递归渲染 -->
                                        <button @click="selectCatalog({id: 'root_all', name: '全部'})" type="button"
                                            class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                            <i class="ph ph-folder text-yellow-500"></i>全部
                                        </button>
                                        <button @click="selectCatalog({id: 'root_common', name: '公共资源库'})" type="button"
                                            class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2 ml-4">
                                            <i class="ph ph-folder text-yellow-500"></i>公共资源库
                                        </button>
                                        <button @click="selectCatalog({id: 'root_hr', name: 'HR 人力资源域'})" type="button"
                                            class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                            <i class="ph ph-folder text-yellow-500"></i>HR 人力资源域
                                        </button>
                                        <button @click="selectCatalog({id: 'cat_hr_workflows', name: '审批流程'})"
                                            type="button"
                                            class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2 ml-4">
                                            <i class="ph ph-folder text-yellow-500"></i>审批流程
                                        </button>
                                        <button @click="selectCatalog({id: 'root_sre', name: 'SRE 运维域'})" type="button"
                                            class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                            <i class="ph ph-folder text-yellow-500"></i>SRE 运维域
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 方式2: 从生产环境接入新的数据资源 -->
                <template v-if="method === 'ONLINE'">
                    <!-- Step 2: 选择数据源和表 -->
                    <div v-if="step === 2" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">数据来源</label>
                            <div class="grid grid-cols-3 gap-3">
                                <button @click="$emit('update:form', {...form, dataSource: 'tiangong'})"
                                    :class="['px-4 py-3 border-2 rounded-lg text-sm font-medium transition-all', form.dataSource === 'tiangong' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-200 hover:border-indigo-300 text-slate-700']">
                                    <i class="ph ph-cloud text-lg mb-1 block"></i>天工
                                </button>
                                <button @click="$emit('update:form', {...form, dataSource: 'datahub'})"
                                    :class="['px-4 py-3 border-2 rounded-lg text-sm font-medium transition-all', form.dataSource === 'datahub' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-200 hover:border-indigo-300 text-slate-700']">
                                    <i class="ph ph-database text-lg mb-1 block"></i>DataHub
                                </button>
                                <button @click="$emit('update:form', {...form, dataSource: 'mysql'})"
                                    :class="['px-4 py-3 border-2 rounded-lg text-sm font-medium transition-all', form.dataSource === 'mysql' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-200 hover:border-indigo-300 text-slate-700']">
                                    <i class="ph ph-database text-lg mb-1 block"></i>MySQL
                                </button>
                            </div>
                        </div>
                        <template v-if="form.dataSource">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">选择要引入的表</label>
                                <div class="border border-slate-200 rounded-lg overflow-hidden">
                                    <!-- 搜索框 -->
                                    <div class="p-3 bg-slate-50 border-b border-slate-200">
                                        <div class="relative">
                                            <i
                                                class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                            <input v-model="tableSearchQuery" type="text" placeholder="搜索表名或描述..."
                                                class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                                        </div>
                                    </div>
                                    <!-- 表列表 (单选) -->
                                    <div class="divide-y divide-slate-200 max-h-80 overflow-y-auto">
                                        <div v-for="table in filteredTables" :key="table.name"
                                            @click="$emit('select-table', table)"
                                            :class="['flex items-center gap-3 px-4 py-3 cursor-pointer transition-colors', 
                                                                 isTableSelected(table) ? 'bg-indigo-50' : 'hover:bg-slate-50']">
                                            <input type="radio" :checked="isTableSelected(table)" :name="'table-select'"
                                                @click.stop class="text-indigo-600 focus:ring-indigo-500" />
                                            <div class="flex-1">
                                                <div class="font-medium text-slate-900">{{ table.name }}</div>
                                                <div class="text-xs text-slate-500 mt-0.5">{{ table.description }}</div>
                                            </div>
                                        </div>
                                        <div v-if="filteredTables.length === 0"
                                            class="px-4 py-8 text-center text-slate-400 text-sm">
                                            <i class="ph ph-magnifying-glass text-2xl block mb-2"></i>
                                            未找到匹配的表
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- 方式3: 通过本地文件上传 -->
                <template v-if="method === 'EXCEL'">
                    <!-- Step 2: 上传文件并选择Sheet -->
                    <div v-if="step === 2" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">上传文件</label>
                            <div
                                class="mb-3 flex items-start gap-2 text-xs text-slate-500 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <i class="ph ph-info text-blue-500 text-sm mt-0.5"></i>
                                <p class="leading-relaxed">
                                    提示：系统仅导入连续数据区域（中间无空行/空列），且只保存当前单元格的值，不包含公式和格式。
                                </p>
                            </div>
                            <div @click="$refs.excelInput.click()"
                                class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center hover:border-indigo-400 transition-colors cursor-pointer">
                                <i class="ph ph-file-xls text-4xl text-slate-400 mb-3"></i>
                                <p class="text-sm text-slate-600 mb-2">点击选择或拖拽文件到此处</p>
                                <p class="text-xs text-slate-500">支持 .xlsx, .xls, .csv 格式</p>
                                <input type="file" ref="excelInput" accept=".xlsx,.xls,.csv" class="hidden"
                                    @change="$emit('file-upload', $event)" />
                            </div>
                        </div>
                        <!-- 文件上传后显示Sheet选择 -->
                        <div v-if="form.uploadedFile" class="space-y-3">
                            <div class="flex items-center gap-3 p-3 bg-green-50 border border-green-200 rounded-lg">
                                <i class="ph ph-check-circle text-green-600 text-xl"></i>
                                <div class="flex-1">
                                    <p class="text-sm font-medium text-green-900">{{ form.uploadedFile.name }}</p>
                                    <p class="text-xs text-green-600">{{ form.uploadedFile.size }}</p>
                                </div>
                            </div>
                            <!-- 解析状态 -->
                            <div v-if="form.isParsing"
                                class="flex flex-col items-center justify-center p-8 bg-slate-50 rounded-lg border border-slate-200 border-dashed">
                                <i class="ph ph-circle-notch text-3xl text-indigo-600 animate-spin mb-3"></i>
                                <p class="text-sm text-slate-600">正在解析文件并提取数据表...</p>
                            </div>

                            <div v-if="!form.isParsing && form.availableSheets.length > 0">
                                <label class="block text-sm font-medium text-slate-700 mb-2">选择要导入的 Sheet</label>
                                <div class="border border-slate-200 rounded-lg overflow-hidden">
                                    <div v-for="sheet in form.availableSheets" :key="sheet.name"
                                        @click="$emit('select-sheet', sheet)"
                                        :class="['flex items-center gap-3 px-4 py-3 cursor-pointer transition-colors',
                                                             form.selectedSheet?.name === sheet.name ? 'bg-indigo-50 border-l-4 border-indigo-600' : 'hover:bg-slate-50']">
                                        <input type="radio" :checked="form.selectedSheet?.name === sheet.name"
                                            :name="'sheet-select'" @click.stop
                                            class="text-indigo-600 focus:ring-indigo-500" />
                                        <div class="flex-1">
                                            <div class="font-medium text-slate-900">{{ sheet.name }}</div>
                                            <div class="text-xs text-slate-500 mt-0.5">{{ sheet.rowCount }} 行 × {{
                                                sheet.columnCount }} 列</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Step 3: ONLINE方法 - 元数据预览 -->
            <div v-if="step === 3 && method === 'ONLINE'" class="flex-1 overflow-y-auto p-6 space-y-4">
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <h3 class="font-semibold text-slate-900 mb-1">{{ form.tableMetadata.name }}</h3>
                    <p class="text-sm text-slate-600">{{ form.tableMetadata.description }}</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">字段元数据</label>
                    <div class="border border-slate-200 rounded-lg overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-slate-200">
                                <thead class="bg-slate-50">
                                    <tr>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase">
                                            字段名</th>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase">
                                            类型</th>
                                        <th
                                            class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase w-1/3">
                                            描述</th>
                                        <th
                                            class="px-4 py-3 text-center text-xs font-semibold text-slate-500 uppercase">
                                            加密</th>
                                        <th
                                            class="px-4 py-3 text-center text-xs font-semibold text-slate-500 uppercase">
                                            分区</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 bg-white">
                                    <tr v-for="field in form.tableMetadata.fields" :key="field.name"
                                        class="hover:bg-slate-50">
                                        <td class="px-4 py-3 text-sm">
                                            <div class="flex items-center gap-2">
                                                <span class="font-medium text-slate-900">{{ field.name }}</span>
                                                <span v-if="field.isPrimary"
                                                    class="inline-flex items-center px-1.5 py-0.5 bg-amber-100 text-amber-700 text-xs font-medium rounded">
                                                    <i class="ph ph-key text-xs mr-0.5"></i>主键
                                                </span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-sm text-slate-700">
                                            <code
                                                class="px-2 py-0.5 bg-slate-100 rounded text-xs">{{ field.type }}</code>
                                        </td>
                                        <td class="px-4 py-3 text-sm">
                                            <input type="text" :value="field.description"
                                                @input="$emit('update-field-description', field.name, $event.target.value)"
                                                class="w-full px-2 py-1.5 border border-slate-200 rounded text-xs focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"
                                                placeholder="添加字段描述" />
                                        </td>
                                        <td class="px-4 py-3 text-center">
                                            <span v-if="field.isEncrypted"
                                                class="inline-flex items-center px-1.5 py-0.5 bg-red-100 text-red-700 text-[10px] rounded font-medium">
                                                <i class="ph ph-lock text-xs mr-0.5"></i>加密
                                            </span>
                                            <span v-else class="text-slate-300">-</span>
                                        </td>
                                        <td class="px-4 py-3 text-center">
                                            <span v-if="field.isPartition"
                                                class="inline-flex items-center px-1.5 py-0.5 bg-blue-100 text-blue-700 text-[10px] rounded font-medium">
                                                <i class="ph ph-hard-drives text-xs mr-0.5"></i>分区
                                            </span>
                                            <span v-else class="text-slate-300">-</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 3: EXCEL方法 - 预览数据并编辑元数据 -->
            <div v-if="step === 3 && method === 'EXCEL'" class="flex-1 overflow-y-auto p-6 space-y-4">
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <h3 class="font-semibold text-slate-900 mb-1">{{ form.selectedSheet?.name }}</h3>
                    <p class="text-sm text-slate-600">{{ form.selectedSheet?.rowCount }} 行 × {{
                        form.selectedSheet?.columnCount }} 列</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">字段元数据</label>
                    <div class="border border-slate-200 rounded-lg overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-slate-200">
                                <thead class="bg-slate-50">
                                    <tr>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase">
                                            字段名</th>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase">
                                            类型</th>
                                        <th
                                            class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase w-1/4">
                                            描述</th>
                                        <th
                                            class="px-4 py-3 text-center text-xs font-semibold text-slate-500 uppercase">
                                            加密</th>
                                        <th
                                            class="px-4 py-3 text-center text-xs font-semibold text-slate-500 uppercase">
                                            分区</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 bg-white">
                                    <tr v-for="(field, idx) in form.excelFields" :key="idx" class="hover:bg-slate-50">
                                        <td class="px-4 py-3 text-sm">
                                            <input type="text" :value="field.name"
                                                @input="$emit('update-excel-field', idx, 'name', $event.target.value)"
                                                class="w-full px-2 py-1 border border-slate-200 rounded text-xs font-medium text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                placeholder="字段名" />
                                        </td>
                                        <td class="px-4 py-3 text-sm">
                                            <select :value="field.type"
                                                @change="$emit('update-excel-field', idx, 'type', $event.target.value)"
                                                class="w-full px-2 py-1 border border-slate-200 rounded text-xs bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                                                <option value="STRING">STRING</option>
                                                <option value="BIGINT">BIGINT</option>
                                                <option value="INT">INT</option>
                                                <option value="DOUBLE">DOUBLE</option>
                                                <option value="BOOLEAN">BOOLEAN</option>
                                                <option value="TIMESTAMP">TIMESTAMP</option>
                                                <option value="DATE">DATE</option>
                                            </select>
                                        </td>
                                        <td class="px-4 py-3 text-sm">
                                            <input type="text" :value="field.description"
                                                @input="$emit('update-excel-field', idx, 'description', $event.target.value)"
                                                class="w-full px-2 py-1 border border-slate-200 rounded text-xs focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                placeholder="添加字段描述" />
                                        </td>
                                        <td class="px-4 py-3 text-center">
                                            <input type="checkbox" :checked="field.isEncrypted"
                                                @change="$emit('update-excel-field', idx, 'isEncrypted', $event.target.checked)"
                                                class="rounded border-slate-300 text-red-600 focus:ring-red-500" />
                                        </td>
                                        <td class="px-4 py-3 text-center">
                                            <input type="checkbox" :checked="field.isPartition"
                                                @change="$emit('update-excel-field', idx, 'isPartition', $event.target.checked)"
                                                class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 4: EXCEL方法 - 输入表信息 -->
            <div v-if="step === 4 && method === 'EXCEL'" class="flex-1 overflow-y-auto p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        表名称 <span class="text-red-500">*</span>
                    </label>
                    <input :value="form.tableName"
                        @input="$emit('update:form', {...form, tableName: $event.target.value})"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="例如：员工信息表" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">表描述（选填）</label>
                    <textarea :value="form.description"
                        @input="$emit('update:form', {...form, description: $event.target.value})" rows="3"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
                        placeholder="请描述这个数据表的用途和业务含义..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        放置目录 <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <button @click="showCatalogDropdown = !showCatalogDropdown" type="button"
                            class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm bg-white text-slate-700 hover:border-indigo-300 transition-colors flex items-center justify-between">
                            <span>{{ form.targetCatalog?.name || '请选择目录' }}</span>
                            <i class="ph ph-caret-down text-slate-400"></i>
                        </button>
                        <div v-if="showCatalogDropdown"
                            class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto">
                            <div class="p-2">
                                <!-- 新建目录按钮 -->
                                <button @click.stop="handleCreateNewCatalog" type="button"
                                    class="w-full px-2 py-1.5 mb-1 text-xs font-medium text-indigo-600 hover:bg-indigo-50 rounded flex items-center justify-center gap-1.5 transition-colors">
                                    <i class="ph ph-plus text-sm"></i>新建目录
                                </button>
                                <div class="border-t border-slate-200 my-1"></div>
                                <!-- 简化版目录树 -->
                                <button @click="selectCatalog({id: 'root_all', name: '全部'})" type="button"
                                    class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                    <i class="ph ph-folder text-yellow-500"></i>全部
                                </button>
                                <button @click="selectCatalog({id: 'root_data_warehouse', name: '数据仓库域'})" type="button"
                                    class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                    <i class="ph ph-folder text-yellow-500"></i>数据仓库域
                                </button>
                                <button @click="selectCatalog({id: 'root_hr', name: 'HR 域'})" type="button"
                                    class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                    <i class="ph ph-folder text-yellow-500"></i>HR 域
                                </button>
                                <button @click="selectCatalog({id: 'cat_hr_workflows', name: '审批流程'})" type="button"
                                    class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2 ml-4">
                                    <i class="ph ph-folder text-yellow-500"></i>审批流程
                                </button>
                                <button @click="selectCatalog({id: 'root_sre', name: 'SRE 运维域'})" type="button"
                                    class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                    <i class="ph ph-folder text-yellow-500"></i>SRE 运维域
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 4: ONLINE方法 - 最终确认 -->
            <div v-if="step === 4 && method === 'ONLINE'" class="flex-1 overflow-y-auto p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">表名称</label>
                    <input :value="form.tableMetadata?.name" disabled
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm bg-slate-100 text-slate-500 cursor-not-allowed"
                        placeholder="表名称" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">表描述</label>
                    <textarea :value="form.description"
                        @input="$emit('update:form', {...form, description: $event.target.value})" rows="3"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
                        placeholder="请描述这个数据表的用途和业务含义..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        放置目录 <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <button @click="showCatalogDropdown = !showCatalogDropdown" type="button"
                            class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm bg-white text-slate-700 hover:border-indigo-300 transition-colors flex items-center justify-between">
                            <span>{{ form.targetCatalog?.name || '请选择目录' }}</span>
                            <i class="ph ph-caret-down text-slate-400"></i>
                        </button>
                        <div v-if="showCatalogDropdown"
                            class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto">
                            <div class="p-2">
                                <!-- 新建目录按钮 -->
                                <button @click.stop="handleCreateNewCatalog" type="button"
                                    class="w-full px-2 py-1.5 mb-1 text-xs font-medium text-indigo-600 hover:bg-indigo-50 rounded flex items-center justify-center gap-1.5 transition-colors">
                                    <i class="ph ph-plus text-sm"></i>新建目录
                                </button>
                                <div class="border-t border-slate-200 my-1"></div>
                                <!-- 简化版目录树 -->
                                <button @click="selectCatalog({id: 'root_all', name: '全部'})" type="button"
                                    class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                    <i class="ph ph-folder text-yellow-500"></i>全部
                                </button>
                                <button @click="selectCatalog({id: 'root_data_warehouse', name: '数据仓库域'})" type="button"
                                    class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                    <i class="ph ph-folder text-yellow-500"></i>数据仓库域
                                </button>
                                <button @click="selectCatalog({id: 'root_hr', name: 'HR 域'})" type="button"
                                    class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                    <i class="ph ph-folder text-yellow-500"></i>HR 域
                                </button>
                                <button @click="selectCatalog({id: 'cat_hr_workflows', name: '审批流程'})" type="button"
                                    class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2 ml-4">
                                    <i class="ph ph-folder text-yellow-500"></i>审批流程
                                </button>
                                <button @click="selectCatalog({id: 'root_sre', name: 'SRE 运维域'})" type="button"
                                    class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 rounded flex items-center gap-2">
                                    <i class="ph ph-folder text-yellow-500"></i>SRE 运维域
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 新建目录弹窗 -->
            <div v-if="showNewCatalogForm" class="fixed inset-0 bg-black/30 z-[10000] flex items-center justify-center"
                @click.self="cancelNewCatalog">
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4">
                    <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                        <h3 class="text-lg font-semibold text-slate-900">新建目录</h3>
                        <button @click="cancelNewCatalog" class="p-1 text-slate-400 hover:text-slate-600">
                            <i class="ph ph-x text-xl"></i>
                        </button>
                    </div>

                    <div class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">选择父目录 <span
                                    class="text-red-500">*</span></label>
                            <div class="border border-slate-200 rounded-lg overflow-hidden max-h-48 overflow-y-auto">
                                <button @click="selectNewCatalogParent({id: 'root_all', name: '全部'})" type="button"
                                    :class="['w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 transition-colors border-b border-slate-100',
                                                     newCatalogParent?.id === 'root_all' ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-slate-50']">
                                    <i class="ph ph-folder text-yellow-500"></i>
                                    <span>全部</span>
                                    <i v-if="newCatalogParent?.id === 'root_all'"
                                        class="ph-fill ph-check-circle text-indigo-600 ml-auto"></i>
                                </button>
                                <button @click="selectNewCatalogParent({id: 'root_data_warehouse', name: '数据仓库域'})"
                                    type="button"
                                    :class="['w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 transition-colors border-b border-slate-100',
                                                     newCatalogParent?.id === 'root_data_warehouse' ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-slate-50']">
                                    <i class="ph ph-folder text-yellow-500"></i>
                                    <span>数据仓库域</span>
                                    <i v-if="newCatalogParent?.id === 'root_data_warehouse'"
                                        class="ph-fill ph-check-circle text-indigo-600 ml-auto"></i>
                                </button>
                                <button @click="selectNewCatalogParent({id: 'root_hr', name: 'HR 域'})" type="button"
                                    :class="['w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 transition-colors border-b border-slate-100',
                                                     newCatalogParent?.id === 'root_hr' ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-slate-50']">
                                    <i class="ph ph-folder text-yellow-500"></i>
                                    <span>HR 域</span>
                                    <i v-if="newCatalogParent?.id === 'root_hr'"
                                        class="ph-fill ph-check-circle text-indigo-600 ml-auto"></i>
                                </button>
                                <button @click="selectNewCatalogParent({id: 'root_sre', name: 'SRE 运维域'})" type="button"
                                    :class="['w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 transition-colors',
                                                     newCatalogParent?.id === 'root_sre' ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-slate-50']">
                                    <i class="ph ph-folder text-yellow-500"></i>
                                    <span>SRE 运维域</span>
                                    <i v-if="newCatalogParent?.id === 'root_sre'"
                                        class="ph-fill ph-check-circle text-indigo-600 ml-auto"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">目录名称 <span
                                    class="text-red-500">*</span></label>
                            <input v-model="newCatalogName" type="text" placeholder="输入新目录名称"
                                class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                        </div>
                    </div>

                    <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-3">
                        <button @click="cancelNewCatalog" type="button"
                            class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors text-sm">
                            取消
                        </button>
                        <button @click="confirmNewCatalog" type="button"
                            class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-sm">
                            确认
                        </button>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-3 flex-shrink-0">
                <button @click="handleClose"
                    class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors text-sm">
                    取消
                </button>
                <!-- VIEW 方式：直接完成 -->
                <button v-if="step === 2 && method === 'VIEW'" @click="handleSave"
                    class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center gap-2 text-sm">
                    <i class="ph ph-check"></i>完成创建
                </button>
                <!-- ONLINE 方式 Step 3：进入最终确认 -->
                <button v-if="step === 3 && method === 'ONLINE'" @click="$emit('preview')"
                    class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center gap-2 text-sm">
                    <i class="ph ph-arrow-right"></i>下一步
                </button>
                <!-- ONLINE 方式 Step 4：完成创建 -->
                <button v-if="step === 4 && method === 'ONLINE'" @click="handleSave" :disabled="!form.targetCatalog"
                    :class="['px-4 py-2 rounded-lg transition-colors flex items-center gap-2 text-sm',
                                     !form.targetCatalog ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700']">
                    <i class="ph ph-check"></i>完成创建
                </button>
                <!-- EXCEL 方式 Step 2：进入元数据预览 -->
                <button v-if="step === 2 && method === 'EXCEL' && form.selectedSheet" @click="$emit('preview')"
                    class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center gap-2 text-sm">
                    <i class="ph ph-arrow-right"></i>下一步
                </button>
                <!-- EXCEL 方式 Step 3：进入表信息输入 -->
                <button v-if="step === 3 && method === 'EXCEL'" @click="$emit('next-step')"
                    class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center gap-2 text-sm">
                    <i class="ph ph-arrow-right"></i>下一步
                </button>
                <!-- EXCEL 方式 Step 4：完成创建 -->
                <button v-if="step === 4 && method === 'EXCEL'" @click="handleSave"
                    :disabled="!form.tableName || !form.targetCatalog"
                    :class="['px-4 py-2 rounded-lg transition-colors flex items-center gap-2 text-sm',
                             (!form.tableName || !form.targetCatalog) ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700']">
                    <i class="ph ph-check"></i>完成创建
                </button>
            </div>
        </div>
    </div>

</div>
